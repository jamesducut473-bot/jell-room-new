<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Private Video Room</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
}

header {
  height: 58px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 16px;

  background: #1b1b1b;
}

.title {
  font-size: 18px;
  font-weight: bold;
}

#status {
  font-size: 13px;
  color: #bbb;
}

#videos {
  flex: 1;

  display: grid;
  grid-template-columns: repeat(2, 1fr);

  gap: 10px;
  padding: 10px;

  min-height: 0;
}

.video-container {
  position: relative;

  background: #000;

  border-radius: 12px;

  overflow: hidden;

  min-height: 250px;
}

video {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: cover;

  background: #000;
}

#localVideo {
  transform: scaleX(-1);
}

.video-label {
  position: absolute;

  left: 10px;
  bottom: 10px;

  padding: 6px 9px;

  background: rgba(0, 0, 0, 0.6);

  border-radius: 6px;

  font-size: 12px;
}

#waiting {
  position: absolute;

  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  color: #aaa;

  background: #000;
}

#controls {
  height: 75px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 12px;

  background: #1b1b1b;
}

button {
  width: 48px;
  height: 48px;

  border: none;
  border-radius: 50%;

  background: #333;

  color: white;

  font-size: 19px;

  cursor: pointer;
}

button.off {
  background: #b83c3c;
}

@media (max-width: 700px) {
  #videos {
    grid-template-columns: 1fr;
  }

  .video-container {
    min-height: 220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="title">
    Private Video Room
  </div>

  <div id="status">
    Starting...
  </div>
</header>

<main id="videos">

  <div class="video-container">
    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <div class="video-label">
      You
    </div>
  </div>

  <div class="video-container">

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <div id="waiting">
      Waiting for your friend...
    </div>

    <div class="video-label">
      Friend
    </div>

  </div>

</main>

<div id="controls">

  <button id="micButton">
    🎙️
  </button>

  <button id="cameraButton">
    📹
  </button>

</div>

<script>
const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const statusText =
  document.getElementById("status");

const waiting =
  document.getElementById("waiting");

const micButton =
  document.getElementById("micButton");

const cameraButton =
  document.getElementById("cameraButton");


let socket = null;

let localStream = null;

let peerConnection = null;

let clientId =
  localStorage.getItem("videoClientId");

let role = null;

let peerPresent = false;

let reconnectTimer = null;

let candidateQueue = [];

let remoteDescriptionReady = false;

let callStarting = false;

let manuallyStopped = false;


/*
 * Status
 */

function setStatus(text) {
  statusText.textContent = text;
}


/*
 * Signaling
 */

function send(message) {
  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(
      JSON.stringify(message)
    );
  }
}


/*
 * Camera + microphone
 */

async function startMedia() {
  if (localStream) {
    return;
  }

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: {
        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        },

        frameRate: {
          ideal: 30,
          max: 30
        }
      },

      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        channelCount: 1
      }
    });

  localVideo.srcObject =
    localStream;

  try {
    await localVideo.play();
  } catch {}
}


/*
 * ICE configuration
 */

async function getIceServers() {
  try {
    const response =
      await fetch(
        "/ice-config",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      data &&
      Array.isArray(data.iceServers)
    ) {
      return data.iceServers;
    }
  } catch (error) {
    console.warn(
      "ICE config failed",
      error
    );
  }

  return [
    {
      urls: [
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302"
      ]
    }
  ];
}


/*
 * Create ONE peer connection.
 *
 * We do not recreate this connection
 * every time an ICE candidate arrives.
 * This prevents repeated loading.
 */

async function createPeerConnection() {
  if (peerConnection) {
    return peerConnection;
  }

  const iceServers =
    await getIceServers();

  const pc =
    new RTCPeerConnection({
      iceServers,

      iceCandidatePoolSize: 10,

      bundlePolicy: "max-bundle",

      rtcpMuxPolicy: "require"
    });

  peerConnection = pc;

  candidateQueue = [];

  remoteDescriptionReady = false;


  /*
   * Add local tracks ONCE.
   */

  if (localStream) {
    localStream
      .getTracks()
      .forEach(track => {
        pc.addTrack(
          track,
          localStream
        );
      });
  }


  /*
   * Send ICE candidates.
   */

  pc.onicecandidate = event => {
    if (!event.candidate) {
      return;
    }

    send({
      type: "candidate",
      candidate: event.candidate
    });
  };


  /*
   * Receive remote video/audio.
   */

  pc.ontrack = event => {
    let stream =
      event.streams &&
      event.streams[0];

    if (!stream) {
      if (
        !remoteVideo.srcObject
      ) {
        remoteVideo.srcObject =
          new MediaStream();
      }

      stream =
        remoteVideo.srcObject;

      const alreadyAdded =
        stream
          .getTracks()
          .some(
            track =>
              track.id ===
              event.track.id
          );

      if (!alreadyAdded) {
        stream.addTrack(
          event.track
        );
      }
    }

    remoteVideo.srcObject =
      stream;

    waiting.style.display =
      "none";

    /*
     * Make sure audio is not muted.
     */
    remoteVideo.muted = false;

    remoteVideo.volume = 1;

    remoteVideo
      .play()
      .catch(() => {});
  };


  pc.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        pc.iceConnectionState
      );

      if (
        pc.iceConnectionState ===
        "checking"
      ) {
        setStatus(
          "Connecting..."
        );
      }

      if (
        pc.iceConnectionState ===
          "connected" ||
        pc.iceConnectionState ===
          "completed"
      ) {
        setStatus(
          "Connected ✓"
        );
      }

      if (
        pc.iceConnectionState ===
        "failed"
      ) {
        setStatus(
          "Connection failed. Retrying..."
        );

        /*
         * Only the host restarts
         * the negotiation.
         */
        if (role === "host") {
          restartConnection();
        }
      }
    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        pc.connectionState
      );

      if (
        pc.connectionState ===
        "connected"
      ) {
        setStatus(
          "Connected ✓"
        );
      }

      if (
        pc.connectionState ===
        "failed"
      ) {
        if (role === "host") {
          restartConnection();
        }
      }
    };


  return pc;
}


/*
 * HOST starts the call.
 *
 * This is deliberately protected so
 * it cannot repeatedly create offers.
 */

async function startCall() {
  if (
    role !== "host" ||
    !peerPresent ||
    callStarting
  ) {
    return;
  }

  callStarting = true;

  try {
    const pc =
      await createPeerConnection();

    /*
     * Don't create another offer if
     * a negotiation is already underway.
     */
    if (
      pc.signalingState !==
      "stable"
    ) {
      return;
    }

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({
      type: "offer",
      offer:
        pc.localDescription
    });

  } catch (error) {

    console.error(
      "Call start error:",
      error
    );

  } finally {

    callStarting = false;
  }
}


/*
 * Guest receives offer.
 */

async function receiveOffer(
  offer
) {
  try {

    const pc =
      await createPeerConnection();

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    remoteDescriptionReady =
      true;

    await flushCandidates();

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    send({
      type: "answer",
      answer:
        pc.localDescription
    });

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );
  }
}


/*
 * Host receives answer.
 */

async function receiveAnswer(
  answer
) {
  if (!peerConnection) {
    return;
  }

  try {

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );

    remoteDescriptionReady =
      true;

    await flushCandidates();

  } catch (error) {

    console.error(
      "Answer error:",
      error
    );
  }
}


/*
 * ICE candidate.
 */

async function receiveCandidate(
  candidate
) {
  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {
    candidateQueue.push(
      candidate
    );

    return;
  }

  try {

    await peerConnection
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

  } catch (error) {

    console.warn(
      "ICE candidate error:",
      error
    );
  }
}


/*
 * Process candidates that arrived
 * before the remote description.
 */

async function flushCandidates() {
  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {
    return;
  }

  const queued =
    candidateQueue;

  candidateQueue = [];

  for (
    const candidate of queued
  ) {
    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    } catch (error) {

      console.warn(
        "Queued ICE error:",
        error
      );
    }
  }
}


/*
 * Connection retry.
 *
 * Do not immediately create
 * endless offers.
 */

function restartConnection() {
  clearTimeout(
    reconnectTimer
  );

  reconnectTimer =
    setTimeout(
      async () => {

        if (
          manuallyStopped ||
          !peerPresent ||
          role !== "host"
        ) {
          return;
        }

        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }

        candidateQueue = [];

        remoteDescriptionReady =
          false;

        await startCall();

      },
      2500
    );
}


/*
 * WebSocket connection.
 */

function connectSocket() {
  if (manuallyStopped) {
    return;
  }

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      `${protocol}//${location.host}`
    );


  socket.onopen = () => {

    setStatus(
      "Joining room..."
    );

    send({
      type: "join",
      clientId:
        clientId || undefined
    });
  };


  socket.onmessage =
    async event => {

      let message;

      try {

        message =
          JSON.parse(
            event.data
          );

      } catch {
        return;
      }


      /*
       * Successfully joined
       * the ONE room.
       */

      if (
        message.type ===
        "joined"
      ) {

        clientId =
          message.clientId;

        localStorage.setItem(
          "videoClientId",
          clientId
        );

        role =
          message.role;

        peerPresent =
          !!message.peerPresent;


        if (peerPresent) {

          setStatus(
            "Friend found. Connecting..."
          );

          /*
           * Only host starts.
           */
          if (
            role === "host"
          ) {
            await startCall();
          }

        } else {

          setStatus(
            "Waiting for your friend..."
          );
        }

        return;
      }


      /*
       * Second person joined.
       */

      if (
        message.type ===
        "peer-joined"
      ) {

        peerPresent = true;

        setStatus(
          "Friend joined. Connecting..."
        );

        if (
          role === "host"
        ) {
          await startCall();
        }

        return;
      }


      /*
       * Reconnected peer.
       */

      if (
        message.type ===
        "peer-reconnected"
      ) {

        peerPresent = true;

        if (
          role === "host"
        ) {
          restartConnection();
        }

        return;
      }


      /*
       * Offer.
       */

      if (
        message.type ===
        "offer"
      ) {

        peerPresent = true;

        await receiveOffer(
          message.offer
        );

        return;
      }


      /*
       * Answer.
       */

      if (
        message.type ===
        "answer"
      ) {

        await receiveAnswer(
          message.answer
        );

        return;
      }


      /*
       * ICE.
       */

      if (
        message.type ===
        "candidate"
      ) {

        await receiveCandidate(
          message.candidate
        );

        return;
      }


      /*
       * Friend disconnected.
       */

      if (
        message.type ===
        "peer-disconnected"
      ) {

        peerPresent = false;

        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }

        remoteVideo.srcObject =
          null;

        waiting.style.display =
          "flex";

        setStatus(
          "Waiting for your friend..."
        );

        return;
      }


      /*
       * Third user.
       */

      if (
        message.type ===
        "room-full"
      ) {

        setStatus(
          "Room is full."
        );

        return;
      }
    };


  socket.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

    setStatus(
      "Connection error..."
    );
  };


  socket.onclose = () => {

    if (manuallyStopped) {
      return;
    }

    setStatus(
      "Disconnected. Reconnecting..."
    );

    clearTimeout(
      reconnectTimer
    );

    reconnectTimer =
      setTimeout(
        connectSocket,
        2000
      );
  };
}


/*
 * Microphone.
 */

micButton.onclick = () => {

  if (!localStream) {
    return;
  }

  const tracks =
    localStream.getAudioTracks();

  tracks.forEach(track => {
    track.enabled =
      !track.enabled;
  });

  const muted =
    tracks.length > 0 &&
    !tracks[0].enabled;

  micButton.classList.toggle(
    "off",
    muted
  );
};


/*
 * Camera.
 */

cameraButton.onclick = () => {

  if (!localStream) {
    return;
  }

  const tracks =
    localStream.getVideoTracks();

  tracks.forEach(track => {
    track.enabled =
      !track.enabled;
  });

  const disabled =
    tracks.length > 0 &&
    !tracks[0].enabled;

  cameraButton.classList.toggle(
    "off",
    disabled
  );
};


/*
 * AUTOMATIC START.
 *
 * There is no Join Room button.
 */

async function start() {

  try {

    setStatus(
      "Starting camera..."
    );

    await startMedia();

    setStatus(
      "Connecting..."
    );

    connectSocket();

  } catch (error) {

    console.error(
      "Media error:",
      error
    );

    setStatus(
      "Please allow camera and microphone access."
    );
  }
}

start();
</script>

</body>
</html>
