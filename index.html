<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Jell & James</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ee;
  color: #26352a;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.header {
  height: 64px;
  background: #dcebdc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #c9dcc9;
}

.logo {
  font-weight: 700;
  font-size: 20px;
}

.status {
  font-size: 13px;
  color: #55705b;
}

.main {
  display: grid;
  grid-template-columns:
    minmax(0, 7fr)
    minmax(190px, 3fr);

  gap: 12px;
  padding: 14px;

  max-width: 1700px;
  margin: auto;
}

.movie-card {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.movie-card iframe,
.movie-card video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.placeholder {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  text-align: center;
  padding: 30px;
}

.movie-info {
  background: white;
  border-radius: 14px;
  margin-top: 12px;
  padding: 16px;
}

.movie-title {
  font-size: 20px;
  font-weight: 700;
}

.movie-input {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.movie-input input {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
  outline: none;
}

.primary {
  border: 0;
  background: #739b78;
  color: white;
  border-radius: 10px;
  padding: 11px 15px;
}

.side {
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.video-tile {
  position: relative;
  background: #18221b;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#localVideo {
  transform: scaleX(-1);
}

.video-name {
  position: absolute;
  left: 8px;
  bottom: 7px;
  background: rgba(0,0,0,.6);
  color: white;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 12px;
}

.camera-off {
  display: none;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  color: white;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding-top: 12px;
}

.control {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #edf2ed;
}

.control.off {
  background: #c96f6f;
  color: white;
}

.end {
  background: #bd5555;
  color: white;
}

@media (max-width: 850px) {

  .main {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    Jell & James
  </div>

  <div
    class="status"
    id="roomStatus"
  >
    Connecting...
  </div>

</header>


<main class="main">

<section>

  <div
    class="movie-card"
    id="movieContainer"
  >

    <div class="placeholder">
      Paste a video URL below.
    </div>

  </div>


  <div class="movie-info">

    <div class="movie-title">
      Watch Together
    </div>

    <div class="movie-input">

      <input
        id="movieUrl"
        placeholder="Paste video URL..."
      >

      <button
        class="primary"
        onclick="loadMovie()"
      >
        Play
      </button>

    </div>

  </div>

</section>


<aside class="side">

  <div class="video-grid">

    <div class="video-tile">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div
        class="camera-off"
        id="cameraOff"
      >
        Camera Off
      </div>

      <div class="video-name">
        You
      </div>

    </div>


    <div
      class="video-tile"
      id="guestTile"
      style="display:none;"
    >

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div class="video-name">
        Friend
      </div>

    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      id="micButton"
      onclick="toggleMic()"
    >
      🎙️
    </button>

    <button
      class="control"
      id="cameraButton"
      onclick="toggleCamera()"
    >
      📹
    </button>

    <button
      class="control end"
      onclick="leaveRoom()"
    >
      ✕
    </button>

  </div>

</aside>

</main>


<script>

/*
==================================================
IMPORTANT
==================================================
PALITAN LANG ANG URL NA ITO NG ACTUAL
RENDER WEBSOCKET URL NG SERVER MO.
==================================================
*/

const SIGNALING_URL =
  "wss://YOUR-RENDER-DOMAIN.onrender.com";


/*
==================================================
AUTOMATIC CLIENT ID
==================================================
*/

function getClientId() {

  let id =
    localStorage.getItem(
      "jell-client-id"
    );

  if (!id) {

    id =
      "client-" +
      crypto.randomUUID();

    localStorage.setItem(
      "jell-client-id",
      id
    );

  }

  return id;
}

const clientId =
  getClientId();


/*
==================================================
STATE
==================================================
*/

let socket = null;

let localStream = null;

let peerConnection = null;

let role = null;

let peerPresent = false;

let reconnectTimer = null;

let offerTimer = null;

let pendingCandidates = [];

let remoteDescriptionReady = false;

let makingOffer = false;


/*
==================================================
UI
==================================================
*/

function setStatus(text) {

  document.getElementById(
    "roomStatus"
  ).textContent = text;

}


/*
==================================================
CAMERA
==================================================
*/

async function startCamera() {

  if (localStream) {
    return true;
  }

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          },
          frameRate: {
            ideal: 30,
            max: 30
          }
        },

        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }

      });


    document.getElementById(
      "localVideo"
    ).srcObject =
      localStream;


    return true;

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    setStatus(
      "Please allow camera and microphone."
    );

    return false;

  }

}


/*
==================================================
CONNECT
==================================================
*/

function connect() {

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }


  setStatus(
    "Connecting..."
  );


  socket =
    new WebSocket(
      SIGNALING_URL
    );


  socket.onopen =
    async () => {

      setStatus(
        "Joining the only room..."
      );


      /*
       * clientId is sent if we already have one.
       * Server can also generate one automatically.
       */

      socket.send(
        JSON.stringify({
          type: "join",
          clientId
        })
      );


      await startCamera();

    };


  socket.onmessage =
    async event => {

      let data;

      try {

        data =
          JSON.parse(
            event.data
          );

      } catch {

        return;

      }


      /*
      ==========================================
      JOINED
      ==========================================
      */

      if (data.type === "joined") {

        /*
         * Server confirms/generates our ID.
         */

        if (data.clientId) {

          localStorage.setItem(
            "jell-client-id",
            data.clientId
          );

        }


        role =
          data.role;

        peerPresent =
          !!data.peerPresent;


        if (peerPresent) {

          setStatus(
            "Friend found — connecting video..."
          );


          if (role === "host") {

            await createConnection();

            await makeOffer();

          }

        } else {

          setStatus(
            "You're alone in the room — waiting..."
          );

        }

        return;
      }


      /*
      ==========================================
      SECOND USER
      ==========================================
      */

      if (
        data.type === "peer-joined" ||
        data.type === "peer-rejoined"
      ) {

        peerPresent = true;


        setStatus(
          "Friend joined — connecting..."
        );


        /*
         * Only host creates offers.
         */

        if (role === "host") {

          await createConnection();

          await makeOffer();

        }

        return;
      }


      /*
      ==========================================
      OFFER
      ==========================================
      */

      if (data.type === "offer") {

        peerPresent = true;

        await handleOffer(
          data.offer
        );

        return;
      }


      /*
      ==========================================
      ANSWER
      ==========================================
      */

      if (data.type === "answer") {

        await handleAnswer(
          data.answer
        );

        return;
      }


      /*
      ==========================================
      ICE
      ==========================================
      */

      if (data.type === "candidate") {

        await handleCandidate(
          data.candidate
        );

        return;
      }


      /*
      ==========================================
      ROOM FULL
      ==========================================
      */

      if (data.type === "room-full") {

        peerPresent = false;

        setStatus(
          "Room is full — maximum 2 people."
        );

        return;
      }


      /*
      ==========================================
      PEER LEFT
      ==========================================
      */

      if (data.type === "peer-left") {

        peerPresent = false;

        clearOfferTimer();

        closePeer();

        removeRemoteVideo();

        setStatus(
          "Friend left — waiting..."
        );

        return;
      }

    };


  socket.onerror =
    error => {

      console.error(
        "WebSocket error:",
        error
      );

      setStatus(
        "Connection error — retrying..."
      );

    };


  socket.onclose =
    () => {

      setStatus(
        "Disconnected — reconnecting..."
      );


      clearTimeout(
        reconnectTimer
      );


      reconnectTimer =
        setTimeout(
          connect,
          1500
        );

    };

}


/*
==================================================
PEER CONNECTION
==================================================
*/

async function createConnection() {

  closePeer();


  peerConnection =
    new RTCPeerConnection({

      iceServers: [

        {
          urls: [
            "stun:stun.l.google.com:19302",
            "stun:stun1.l.google.com:19302"
          ]
        }

      ],

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require"

    });


  remoteDescriptionReady =
    false;

  pendingCandidates =
    [];


  /*
   * Add local tracks once.
   */

  if (localStream) {

    for (
      const track of
      localStream.getTracks()
    ) {

      peerConnection.addTrack(
        track,
        localStream
      );

    }

  }


  /*
   * ICE
   */

  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "candidate",
          candidate:
            event.candidate
        });

      }

    };


  /*
   * REMOTE VIDEO
   */

  peerConnection.ontrack =
    event => {

      if (
        event.streams &&
        event.streams[0]
      ) {

        const remote =
          document.getElementById(
            "remoteVideo"
          );

        remote.srcObject =
          event.streams[0];


        document.getElementById(
          "guestTile"
        ).style.display =
          "block";


        remote.play().catch(
          () => {}
        );

      }

    };


  /*
   * CONNECTION STATE
   */

  peerConnection
    .onconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      const state =
        peerConnection.connectionState;


      if (state === "connected") {

        clearOfferTimer();

        setStatus(
          "Connected ✓"
        );

      }


      if (
        state === "failed" ||
        state === "disconnected"
      ) {

        setStatus(
          "Reconnecting video..."
        );


        if (role === "host") {

          scheduleOfferRetry();

        }

      }

    };


  peerConnection
    .oniceconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      if (
        (
          peerConnection
            .iceConnectionState ===
            "failed"
        ) &&
        role === "host"
      ) {

        scheduleOfferRetry();

      }

    };

}


/*
==================================================
OFFER
==================================================
*/

async function makeOffer() {

  if (
    !peerConnection ||
    role !== "host" ||
    makingOffer ||
    !peerPresent
  ) {
    return;
  }


  makingOffer = true;


  try {

    const offer =
      await peerConnection
        .createOffer({
          iceRestart: true
        });


    await peerConnection
      .setLocalDescription(
        offer
      );


    send({
      type: "offer",
      offer:
        peerConnection
          .localDescription
    });


    scheduleOfferRetry();

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  } finally {

    makingOffer = false;

  }

}


/*
==================================================
RECEIVE OFFER
==================================================
*/

async function handleOffer(
  offer
) {

  try {

    if (!peerConnection) {

      await createConnection();

    }


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


    remoteDescriptionReady =
      true;


    await flushCandidates();


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    send({
      type: "answer",
      answer:
        peerConnection
          .localDescription
    });


  } catch (error) {

    console.error(
      "Offer handling error:",
      error
    );

  }

}


/*
==================================================
RECEIVE ANSWER
==================================================
*/

async function handleAnswer(
  answer
) {

  if (!peerConnection) {
    return;
  }


  try {

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


    remoteDescriptionReady =
      true;


    await flushCandidates();

  } catch (error) {

    console.error(
      "Answer error:",
      error
    );

  }

}


/*
==================================================
ICE CANDIDATES
==================================================
*/

async function handleCandidate(
  candidate
) {

  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {

    pendingCandidates.push(
      candidate
    );

    return;

  }


  try {

    await peerConnection
      .addIceCandidate(
        candidate
      );

  } catch (error) {

    console.warn(
      "ICE error:",
      error
    );

  }

}


async function flushCandidates() {

  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {
    return;
  }


  const list =
    pendingCandidates;


  pendingCandidates = [];


  for (
    const candidate of
    list
  ) {

    try {

      await peerConnection
        .addIceCandidate(
          candidate
        );

    } catch {}

  }

}


/*
==================================================
RETRY
==================================================
*/

function scheduleOfferRetry() {

  clearOfferTimer();


  offerTimer =
    setTimeout(
      async () => {

        if (
          role === "host" &&
          peerPresent
        ) {

          await createConnection();

          await makeOffer();

        }

      },
      3000
    );

}


function clearOfferTimer() {

  if (offerTimer) {

    clearTimeout(
      offerTimer
    );

    offerTimer = null;

  }

}


/*
==================================================
CLOSE PEER
==================================================
*/

function closePeer() {

  if (peerConnection) {

    try {
      peerConnection.close();
    } catch {}

  }

  peerConnection = null;

  remoteDescriptionReady =
    false;

  pendingCandidates =
    [];

  makingOffer =
    false;

}


/*
==================================================
REMOTE VIDEO
==================================================
*/

function removeRemoteVideo() {

  const video =
    document.getElementById(
      "remoteVideo"
    );

  if (video) {
    video.srcObject = null;
  }


  document.getElementById(
    "guestTile"
  ).style.display =
    "none";

}


/*
==================================================
SEND
==================================================
*/

function send(data) {

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return false;
  }


  socket.send(
    JSON.stringify(data)
  );


  return true;

}


/*
==================================================
MIC
==================================================
*/

function toggleMic() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getAudioTracks();


  if (!tracks.length) {
    return;
  }


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track => {
      track.enabled =
        !enabled;
    }
  );


  document.getElementById(
    "micButton"
  ).classList.toggle(
    "off",
    enabled
  );

}


/*
==================================================
CAMERA
==================================================
*/

function toggleCamera() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getVideoTracks();


  if (!tracks.length) {
    return;
  }


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track => {
      track.enabled =
        !enabled;
    }
  );


  document.getElementById(
    "cameraButton"
  ).classList.toggle(
    "off",
    enabled
  );


  document.getElementById(
    "cameraOff"
  ).style.display =
    enabled
      ? "flex"
      : "none";

}


/*
==================================================
MOVIE
==================================================
*/

function loadMovie() {

  const input =
    document.getElementById(
      "movieUrl"
    );


  const url =
    input.value.trim();


  if (!url) {
    return;
  }


  showMovie(
    url
  );

}


function showMovie(url) {

  const container =
    document.getElementById(
      "movieContainer"
    );


  const youtube =
    getYouTubeId(
      url
    );


  if (youtube) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      "https://www.youtube.com/embed/" +
      youtube +
      "?rel=0";


    iframe.allow =
      "autoplay; fullscreen";

    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";

    container.appendChild(
      iframe
    );


  } else {

    const video =
      document.createElement(
        "video"
      );


    video.src =
      url;

    video.controls =
      true;

    video.playsInline =
      true;


    container.innerHTML =
      "";

    container.appendChild(
      video
    );

  }

}


function getYouTubeId(url) {

  const match =
    url.match(
      /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
    );


  return match
    ? match[1]
    : null;

}


/*
==================================================
LEAVE
==================================================
*/

function leaveRoom() {

  clearOfferTimer();

  clearTimeout(
    reconnectTimer
  );


  closePeer();


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream = null;

  }


  if (socket) {

    try {
      socket.close();
    } catch {}

  }


  setStatus(
    "Disconnected."
  );

}


/*
==================================================
START
==================================================
*/

startCamera();

connect();

</script>

</body>

</html>
