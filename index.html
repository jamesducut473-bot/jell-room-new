<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Jell & James</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ee;
      color: #26352a;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      height: 64px;
      background: #dcebdc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #c9dcc9;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
    }

    .status {
      font-size: 13px;
      color: #55705b;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 7fr) minmax(220px, 3fr);
      gap: 12px;
      padding: 14px;
      max-width: 1700px;
      margin: auto;
    }

    .movie-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    .movie-card iframe,
    .movie-card video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .placeholder {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      text-align: center;
      padding: 20px;
    }

    .movie-info {
      background: white;
      border-radius: 14px;
      margin-top: 12px;
      padding: 16px;
    }

    .movie-title {
      font-size: 20px;
      font-weight: 700;
    }

    .movie-input {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .movie-input input {
      flex: 1;
      min-width: 0;
      padding: 11px;
      border: 1px solid #ccd8cc;
      border-radius: 10px;
      outline: none;
    }

    .primary {
      border: 0;
      background: #739b78;
      color: white;
      border-radius: 10px;
      padding: 11px 15px;
    }

    .side {
      background: white;
      border-radius: 16px;
      padding: 10px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .video-tile {
      position: relative;
      background: #101510;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    .video-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    #localVideo {
      transform: scaleX(-1);
    }

    .video-name {
      position: absolute;
      left: 8px;
      bottom: 7px;
      background: rgba(0, 0, 0, .6);
      color: white;
      padding: 4px 7px;
      border-radius: 6px;
      font-size: 12px;
    }

    .waiting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      color: #aaa;
      background: #101510;
    }

    .camera-off {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      background: #101510;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 9px;
      padding-top: 12px;
    }

    .control {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #edf2ed;
    }

    .control.off {
      background: #c96f6f;
      color: white;
    }

    .end {
      background: #bd5555;
      color: white;
    }

    .join-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .65);
    }

    .join-box {
      width: 100%;
      max-width: 380px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
    }

    .join-box h2 {
      margin-top: 0;
    }

    .join-box p {
      color: #657067;
      font-size: 14px;
      line-height: 1.5;
    }

    .join-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #739b78;
      color: white;
      font-weight: 700;
      margin-top: 10px;
    }

    .error-box {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: #f8dddd;
      color: #8d3030;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- JOIN -->
  <div
    class="join-overlay"
    id="joinOverlay"
  >
    <div class="join-box">

      <h2>
        Jell & James
      </h2>

      <p>
        You will automatically join the
        only available room.
      </p>

      <button
        class="join-button"
        id="joinButton"
      >
        Join Room
      </button>

      <div
        class="error-box"
        id="joinError"
      ></div>

    </div>
  </div>


  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      Jell & James
    </div>

    <div
      class="status"
      id="roomStatus"
    >
      Not connected
    </div>

  </header>


  <main class="main">

    <!-- MOVIE -->
    <section>

      <div
        class="movie-card"
        id="movieContainer"
      >
        <div class="placeholder">
          Paste a video URL below.
        </div>
      </div>

      <div class="movie-info">

        <div class="movie-title">
          Watch Together
        </div>

        <div class="movie-input">

          <input
            id="movieUrl"
            type="text"
            placeholder="Paste video URL..."
          >

          <button
            class="primary"
            id="playMovieButton"
          >
            Play
          </button>

        </div>

      </div>

    </section>


    <!-- VIDEO CALL -->
    <aside class="side">

      <div class="video-grid">

        <!-- LOCAL -->
        <div class="video-tile">

          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>

          <div
            class="camera-off"
            id="cameraOff"
          >
            Camera Off
          </div>

          <div class="video-name">
            You
          </div>

        </div>


        <!-- REMOTE -->
        <div
          class="video-tile"
          id="guestTile"
        >

          <video
            id="remoteVideo"
            autoplay
            playsinline
          ></video>

          <div
            class="waiting"
            id="remoteWaiting"
          >
            Waiting for your friend...
          </div>

          <div class="video-name">
            Friend
          </div>

        </div>

      </div>


      <div class="controls">

        <button
          class="control"
          id="micButton"
          title="Microphone"
        >
          🎙️
        </button>

        <button
          class="control"
          id="cameraButton"
          title="Camera"
        >
          📹
        </button>

        <button
          class="control end"
          id="leaveButton"
          title="Leave"
        >
          ✕
        </button>

      </div>

    </aside>

  </main>


  <script>

    // ==========================================
    // WEBSOCKET ADDRESS
    // ==========================================
    //
    // Kung ang index.html at server.js ay nasa
    // SAME Render service, automatic itong gagamit
    // ng parehong domain.
    //
    // Hindi mo na kailangang maglagay ng
    // YOUR-RENDER-DOMAIN.
    //
    // ==========================================

    const SIGNALING_URL =
      location.protocol === "https:"
        ? `wss://${location.host}`
        : `ws://${location.host}`;


    // ==========================================
    // STATE
    // ==========================================

    let socket = null;

    let localStream = null;

    let peerConnection = null;

    let clientId = null;

    let role = null;

    let peerPresent = false;

    let stopped = false;

    let reconnectTimer = null;

    let reconnectAttempts = 0;

    let pendingCandidates = [];

    let remoteDescriptionReady = false;

    let callStarting = false;


    // ==========================================
    // DOM
    // ==========================================

    const joinOverlay =
      document.getElementById("joinOverlay");

    const joinButton =
      document.getElementById("joinButton");

    const joinError =
      document.getElementById("joinError");

    const roomStatus =
      document.getElementById("roomStatus");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");

    const remoteWaiting =
      document.getElementById("remoteWaiting");

    const cameraOff =
      document.getElementById("cameraOff");

    const micButton =
      document.getElementById("micButton");

    const cameraButton =
      document.getElementById("cameraButton");

    const leaveButton =
      document.getElementById("leaveButton");


    // ==========================================
    // CLIENT ID
    // ==========================================

    clientId =
      localStorage.getItem(
        "jell-client-id"
      );


    function saveClientId(id) {
      if (!id) return;

      localStorage.setItem(
        "jell-client-id",
        id
      );
    }


    // ==========================================
    // STATUS
    // ==========================================

    function setStatus(text) {
      roomStatus.textContent = text;
    }


    function showJoinError(text) {
      joinError.textContent = text;
      joinError.style.display = "block";
    }


    // ==========================================
    // CAMERA + MICROPHONE
    // ==========================================

    async function startLocalMedia() {

      if (localStream) {
        return true;
      }

      try {

        localStream =
          await navigator
            .mediaDevices
            .getUserMedia({
              video: {
                width: {
                  ideal: 1280
                },
                height: {
                  ideal: 720
                },
                frameRate: {
                  ideal: 30,
                  max: 30
                }
              },

              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: 1
              }
            });


        localVideo.srcObject =
          localStream;


        await localVideo
          .play()
          .catch(() => {});


        return true;

      } catch (error) {

        console.error(
          "getUserMedia error:",
          error
        );

        showJoinError(
          "Please allow camera and microphone access."
        );

        setStatus(
          "Camera/microphone permission required"
        );

        return false;
      }
    }


    // ==========================================
    // WEBSOCKET
    // ==========================================

    function connectSocket() {

      if (stopped) {
        return;
      }

      if (
        socket &&
        (
          socket.readyState === WebSocket.OPEN ||
          socket.readyState === WebSocket.CONNECTING
        )
      ) {
        return;
      }


      setStatus("Connecting...");


      socket =
        new WebSocket(
          SIGNALING_URL
        );


      socket.onopen = () => {

        reconnectAttempts = 0;

        setStatus(
          "Joining the room..."
        );


        // IMPORTANT:
        // Walang room ID.
        // Server ang naglalagay sa "main".

        socket.send(
          JSON.stringify({
            type: "join",
            clientId: clientId || undefined
          })
        );
      };


      socket.onmessage =
        async event => {

          let message;

          try {
            message =
              JSON.parse(
                event.data
              );
          } catch {
            return;
          }


          // ====================================
          // JOINED
          // ====================================

          if (
            message.type === "joined"
          ) {

            clientId =
              message.clientId;

            saveClientId(clientId);

            role =
              message.role;

            peerPresent =
              Boolean(
                message.peerPresent
              );


            console.log(
              "Joined room:",
              message.room
            );

            console.log(
              "Role:",
              role
            );


            if (peerPresent) {

              setStatus(
                "Friend found — connecting..."
              );


              // HOST LANG ang gagawa
              // ng initial offer.

              if (
                role === "host"
              ) {
                await startCall();
              }

            } else {

              setStatus(
                "Waiting for your friend..."
              );

              remoteWaiting.style.display =
                "flex";
            }

            return;
          }


          // ====================================
          // PEER JOINED
          // ====================================

          if (
            message.type === "peer-joined"
          ) {

            peerPresent = true;

            remoteWaiting.style.display =
              "none";

            setStatus(
              "Friend joined — connecting..."
            );


            // Existing user is host.
            if (
              role === "host"
            ) {

              await startCall();

            }

            return;
          }


          // ====================================
          // PEER RECONNECTED
          // ====================================

          if (
            message.type ===
            "peer-reconnected"
          ) {

            peerPresent = true;

            setStatus(
              "Friend reconnected — reconnecting video..."
            );


            if (
              role === "host"
            ) {

              await startCall();

            }

            return;
          }


          // ====================================
          // OFFER
          // ====================================

          if (
            message.type === "offer"
          ) {

            peerPresent = true;

            await handleOffer(
              message.offer
            );

            return;
          }


          // ====================================
          // ANSWER
          // ====================================

          if (
            message.type === "answer"
          ) {

            await handleAnswer(
              message.answer
            );

            return;
          }


          // ====================================
          // ICE
          // ====================================

          if (
            message.type === "candidate"
          ) {

            await handleCandidate(
              message.candidate
            );

            return;
          }


          // ====================================
          // PEER DISCONNECTED
          // ====================================

          if (
            message.type ===
            "peer-disconnected"
          ) {

            peerPresent = false;

            closePeer();

            remoteVideo.srcObject =
              null;

            remoteWaiting.style.display =
              "flex";

            setStatus(
              "Friend disconnected — waiting..."
            );

            return;
          }


          // ====================================
          // ROOM FULL
          // ====================================

          if (
            message.type === "room-full"
          ) {

            setStatus(
              "Room is full — maximum 2 users."
            );

            showJoinError(
              "The room already has two users."
            );

            return;
          }


          // ====================================
          // ERROR
          // ====================================

          if (
            message.type === "error"
          ) {

            setStatus(
              message.message
            );

            console.error(
              message.message
            );

            return;
          }
        };


      socket.onerror =
        error => {

          console.error(
            "WebSocket error:",
            error
          );

          setStatus(
            "Connection error..."
          );
        };


      socket.onclose =
        () => {

          if (stopped) {
            return;
          }

          setStatus(
            "Disconnected — reconnecting..."
          );


          reconnectAttempts++;


          const delay =
            Math.min(
              1000 *
              Math.pow(
                1.5,
                reconnectAttempts
              ),
              5000
            );


          clearTimeout(
            reconnectTimer
          );


          reconnectTimer =
            setTimeout(
              connectSocket,
              delay
            );
        };
    }


    // ==========================================
    // CREATE PEER CONNECTION
    // ==========================================

    async function createPeerConnection() {

      closePeer();


      peerConnection =
        new RTCPeerConnection({

          iceServers: [
            {
              urls: [
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
              ]
            }
          ],

          bundlePolicy: "max-bundle",

          rtcpMuxPolicy: "require"
        });


      remoteDescriptionReady = false;

      pendingCandidates = [];


      // ========================================
      // LOCAL TRACKS
      // ========================================

      if (localStream) {

        localStream
          .getTracks()
          .forEach(track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          });
      }


      // ========================================
      // ICE
      // ========================================

      peerConnection.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            sendSignal({
              type: "candidate",
              candidate:
                event.candidate
            });
          }
        };


      // ========================================
      // REMOTE VIDEO + AUDIO
      // ========================================

      peerConnection.ontrack =
        async event => {

          console.log(
            "Remote track:",
            event.track.kind
          );


          let stream =
            event.streams &&
            event.streams[0];


          if (!stream) {

            stream =
              remoteVideo.srcObject ||
              new MediaStream();

            if (
              !stream
                .getTracks()
                .includes(
                  event.track
                )
            ) {

              stream.addTrack(
                event.track
              );
            }
          }


          remoteVideo.srcObject =
            stream;


          remoteWaiting.style.display =
            "none";


          /*
           * IMPORTANT:
           * Remote video is NOT muted.
           * Therefore audio can play.
           */

          remoteVideo.muted = false;


          try {

            await remoteVideo.play();

          } catch (error) {

            console.warn(
              "Remote autoplay blocked:",
              error
            );

            setStatus(
              "Connected — tap the video once if audio is muted."
            );
          }
        };


      // ========================================
      // CONNECTION STATE
      // ========================================

      peerConnection.onconnectionstatechange =
        () => {

          if (!peerConnection) {
            return;
          }


          const state =
            peerConnection.connectionState;


          console.log(
            "WebRTC:",
            state
          );


          if (
            state === "connected"
          ) {

            setStatus(
              "Connected ✓"
            );

            return;
          }


          if (
            state === "connecting"
          ) {

            setStatus(
              "Connecting video..."
            );

            return;
          }


          if (
            state === "disconnected"
          ) {

            setStatus(
              "Video connection interrupted..."
            );

            return;
          }


          if (
            state === "failed"
          ) {

            setStatus(
              "Connection failed — retrying..."
            );


            if (
              role === "host" &&
              peerPresent
            ) {

              setTimeout(
                () => {

                  if (
                    !stopped &&
                    peerPresent
                  ) {

                    startCall();
                  }

                },
                1500
              );
            }
          }
        };
    }


    // ==========================================
    // START OFFER
    // ==========================================

    async function startCall() {

      if (
        !peerPresent ||
        stopped ||
        role !== "host" ||
        callStarting
      ) {
        return;
      }


      if (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {
        return;
      }


      callStarting = true;


      try {

        await createPeerConnection();


        const offer =
          await peerConnection
            .createOffer();


        await peerConnection
          .setLocalDescription(
            offer
          );


        sendSignal({
          type: "offer",
          offer:
            peerConnection.localDescription
        });


      } catch (error) {

        console.error(
          "Offer creation failed:",
          error
        );

      } finally {

        callStarting = false;
      }
    }


    // ==========================================
    // HANDLE OFFER
    // ==========================================

    async function handleOffer(
      offer
    ) {

      try {

        await createPeerConnection();


        await peerConnection
          .setRemoteDescription(
            new RTCSessionDescription(
              offer
            )
          );


        remoteDescriptionReady =
          true;


        await flushCandidates();


        const answer =
          await peerConnection
            .createAnswer();


        await peerConnection
          .setLocalDescription(
            answer
          );


        sendSignal({
          type: "answer",
          answer:
            peerConnection.localDescription
        });


      } catch (error) {

        console.error(
          "Offer handling failed:",
          error
        );

        setStatus(
          "Video connection error."
        );
      }
    }


    // ==========================================
    // HANDLE ANSWER
    // ==========================================

    async function handleAnswer(
      answer
    ) {

      if (!peerConnection) {
        return;
      }


      try {

        await peerConnection
          .setRemoteDescription(
            new RTCSessionDescription(
              answer
            )
          );


        remoteDescriptionReady =
          true;


        await flushCandidates();

      } catch (error) {

        console.error(
          "Answer handling failed:",
          error
        );
      }
    }


    // ==========================================
    // HANDLE ICE
    // ==========================================

    async function handleCandidate(
      candidate
    ) {

      if (
        !peerConnection ||
        !remoteDescriptionReady
      ) {

        pendingCandidates.push(
          candidate
        );

        return;
      }


      try {

        await peerConnection
          .addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

      } catch (error) {

        console.warn(
          "ICE candidate failed:",
          error
        );
      }
    }


    // ==========================================
    // FLUSH ICE
    // ==========================================

    async function flushCandidates() {

      if (
        !peerConnection ||
        !remoteDescriptionReady
      ) {
        return;
      }


      const queued =
        pendingCandidates;


      pendingCandidates = [];


      for (
        const candidate of queued
      ) {

        try {

          await peerConnection
            .addIceCandidate(
              new RTCIceCandidate(
                candidate
              )
            );

        } catch (error) {

          console.warn(
            "Queued ICE failed:",
            error
          );
        }
      }
    }


    // ==========================================
    // SEND SIGNAL
    // ==========================================

    function sendSignal(data) {

      if (
        !socket ||
        socket.readyState !==
          WebSocket.OPEN
      ) {

        return false;
      }


      socket.send(
        JSON.stringify(data)
      );


      return true;
    }


    // ==========================================
    // CLOSE PEER
    // ==========================================

    function closePeer() {

      if (peerConnection) {

        try {
          peerConnection.close();
        } catch {}
      }


      peerConnection = null;

      remoteDescriptionReady = false;

      pendingCandidates = [];

      callStarting = false;
    }


    // ==========================================
    // MICROPHONE
    // ==========================================

    micButton.onclick =
      () => {

        if (!localStream) {
          return;
        }


        const tracks =
          localStream.getAudioTracks();


        tracks.forEach(track => {
          track.enabled =
            !track.enabled;
        });


        const muted =
          tracks.length > 0 &&
          !tracks[0].enabled;


        micButton.classList.toggle(
          "off",
          muted
        );
      };


    // ==========================================
    // CAMERA
    // ==========================================

    cameraButton.onclick =
      () => {

        if (!localStream) {
          return;
        }


        const tracks =
          localStream.getVideoTracks();


        tracks.forEach(track => {
          track.enabled =
            !track.enabled;
        });


        const cameraDisabled =
          tracks.length > 0 &&
          !tracks[0].enabled;


        cameraButton.classList.toggle(
          "off",
          cameraDisabled
        );


        cameraOff.style.display =
          cameraDisabled
            ? "flex"
            : "none";
      };


    // ==========================================
    // LEAVE
    // ==========================================

    leaveButton.onclick =
      () => {

        stopped = true;


        clearTimeout(
          reconnectTimer
        );


        closePeer();


        if (localStream) {

          localStream
            .getTracks()
            .forEach(track => {
              track.stop();
            });

          localStream = null;
        }


        if (socket) {

          try {
            socket.close();
          } catch {}
        }


        localVideo.srcObject = null;

        remoteVideo.srcObject = null;


        setStatus(
          "Disconnected"
        );
      };


    // ==========================================
    // JOIN
    // ==========================================

    joinButton.onclick =
      async () => {

        joinButton.disabled = true;

        joinError.style.display =
          "none";


        setStatus(
          "Starting camera and microphone..."
        );


        const mediaReady =
          await startLocalMedia();


        if (!mediaReady) {

          joinButton.disabled = false;

          return;
        }


        joinOverlay.style.display =
          "none";


        connectSocket();
      };


    // ==========================================
    // MOVIE
    // ==========================================

    document
      .getElementById(
        "playMovieButton"
      )
      .onclick =
      loadMovie;


    function loadMovie() {

      const input =
        document.getElementById(
          "movieUrl"
        );


      const url =
        input.value.trim();


      if (!url) {
        return;
      }


      const youtubeId =
        getYouTubeId(url);


      const container =
        document.getElementById(
          "movieContainer"
        );


      if (youtubeId) {

        const iframe =
          document.createElement(
            "iframe"
          );


        iframe.src =
          `https://www.youtube.com/embed/${youtubeId}?rel=0`;


        iframe.allow =
          "autoplay; fullscreen";


        iframe.allowFullscreen =
          true;


        container.innerHTML = "";

        container.appendChild(
          iframe
        );


      } else {

        const video =
          document.createElement(
            "video"
          );


        video.src = url;

        video.controls = true;

        video.playsInline = true;


        container.innerHTML = "";

        container.appendChild(
          video
        );
      }
    }


    function getYouTubeId(url) {

      const match =
        url.match(
          /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
        );


      return match
        ? match[1]
        : null;
    }

  </script>

</body>
</html>
