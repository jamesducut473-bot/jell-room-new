<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>
<title>Video Room</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101510;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 60px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1d291f;
}

#status {
  font-size: 14px;
  color: #b9cbbd;
}

.videos {
  width: 100%;
  min-height: calc(100vh - 60px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.videoBox {
  position: relative;
  min-height: 300px;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  min-height: 300px;
  object-fit: cover;
  background: #000;
}

#localVideo {
  transform: scaleX(-1);
}

.label {
  position: absolute;
  left: 10px;
  bottom: 10px;
  padding: 6px 9px;
  background: rgba(0,0,0,.65);
  border-radius: 7px;
  font-size: 13px;
}

#waiting {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  background: #000;
  text-align: center;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

button {
  border: 0;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  cursor: pointer;
  font-size: 20px;
}

.off {
  background: #c65353;
  color: white;
}

@media (max-width: 700px) {
  .videos {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <strong>Video Room</strong>
  <span id="status">Connecting...</span>
</header>

<div class="videos">

  <div class="videoBox">
    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>
    <div class="label">You</div>
  </div>

  <div class="videoBox">

    <video
      id="remoteVideo"
      autoplay
      playsinline
    ></video>

    <div id="waiting">
      Waiting for your friend...
    </div>

    <div class="label">Friend</div>
  </div>

</div>

<div id="controls">
  <button id="mic">🎙️</button>
  <button id="camera">📹</button>
</div>

<script>
const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const status =
  document.getElementById("status");

const waiting =
  document.getElementById("waiting");

const micButton =
  document.getElementById("mic");

const cameraButton =
  document.getElementById("camera");

let socket = null;
let localStream = null;
let peerConnection = null;

let clientId =
  localStorage.getItem("video-client-id");

let role = null;
let peerPresent = false;

let candidates = [];
let remoteDescriptionSet = false;

let stopped = false;
let reconnectTimer = null;
let makingOffer = false;

function setStatus(text) {
  status.textContent = text;
}

function send(data) {
  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(JSON.stringify(data));
  }
}

async function getIceServers() {
  try {
    const response =
      await fetch("/ice-config", {
        cache: "no-store"
      });

    const data = await response.json();

    return data.iceServers || [];
  } catch {
    return [
      {
        urls: [
          "stun:stun.l.google.com:19302",
          "stun:stun1.l.google.com:19302"
        ]
      }
    ];
  }
}

async function startCamera() {
  if (localStream) return;

  localStream =
    await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

  localVideo.srcObject = localStream;

  await localVideo.play().catch(() => {});
}

async function createPeer() {
  if (peerConnection) {
    peerConnection.close();
  }

  const servers =
    await getIceServers();

  const pc =
    new RTCPeerConnection({
      iceServers: servers,
      iceCandidatePoolSize: 10
    });

  peerConnection = pc;
  candidates = [];
  remoteDescriptionSet = false;

  localStream
    .getTracks()
    .forEach(track => {
      pc.addTrack(track, localStream);
    });

  pc.onicecandidate = event => {
    if (event.candidate) {
      send({
        type: "candidate",
        candidate: event.candidate
      });
    }
  };

  pc.ontrack = event => {
    let stream = event.streams[0];

    if (!stream) {
      stream =
        remoteVideo.srcObject ||
        new MediaStream();

      if (
        !stream
          .getTracks()
          .some(
            t => t.id === event.track.id
          )
      ) {
        stream.addTrack(event.track);
      }
    }

    remoteVideo.srcObject = stream;

    waiting.style.display = "none";

    remoteVideo.play().catch(() => {});
  };

  pc.oniceconnectionstatechange = () => {
    console.log(
      "ICE:",
      pc.iceConnectionState
    );

    if (
      pc.iceConnectionState === "checking"
    ) {
      setStatus("Connecting video...");
    }

    if (
      pc.iceConnectionState === "connected" ||
      pc.iceConnectionState === "completed"
    ) {
      setStatus("Connected ✓");
    }

    if (
      pc.iceConnectionState === "failed"
    ) {
      setStatus("Retrying connection...");

      if (role === "host") {
        restartCall();
      }
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") {
      setStatus("Connected ✓");
    }

    if (pc.connectionState === "failed") {
      if (role === "host") {
        restartCall();
      }
    }
  };

  return pc;
}

async function startCall() {
  if (
    !peerPresent ||
    role !== "host" ||
    makingOffer
  ) {
    return;
  }

  makingOffer = true;

  try {
    const pc =
      await createPeer();

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(offer);

    send({
      type: "offer",
      offer: pc.localDescription
    });
  } catch (error) {
    console.error(error);
  }

  makingOffer = false;
}

async function handleOffer(offer) {
  try {
    const pc =
      await createPeer();

    await pc.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    remoteDescriptionSet = true;

    await flushCandidates();

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    send({
      type: "answer",
      answer: pc.localDescription
    });

  } catch (error) {
    console.error(
      "Offer error:",
      error
    );
  }
}

async function handleAnswer(answer) {
  if (!peerConnection) return;

  try {
    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(answer)
    );

    remoteDescriptionSet = true;

    await flushCandidates();

  } catch (error) {
    console.error(
      "Answer error:",
      error
    );
  }
}

async function handleCandidate(candidate) {
  if (
    !peerConnection ||
    !remoteDescriptionSet
  ) {
    candidates.push(candidate);
    return;
  }

  try {
    await peerConnection.addIceCandidate(
      new RTCIceCandidate(candidate)
    );
  } catch (error) {
    console.warn(
      "ICE error:",
      error
    );
  }
}

async function flushCandidates() {
  if (
    !peerConnection ||
    !remoteDescriptionSet
  ) {
    return;
  }

  const queued = candidates;
  candidates = [];

  for (const candidate of queued) {
    try {
      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );
    } catch (error) {
      console.warn(
        "Queued ICE error:",
        error
      );
    }
  }
}

function restartCall() {
  clearTimeout(reconnectTimer);

  reconnectTimer =
    setTimeout(() => {
      if (
        !stopped &&
        role === "host" &&
        peerPresent
      ) {
        startCall();
      }
    }, 1500);
}

function connectSocket() {
  if (stopped) return;

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      `${protocol}//${location.host}`
    );

  socket.onopen = () => {
    setStatus("Joining room...");

    send({
      type: "join",
      clientId: clientId || undefined
    });
  };

  socket.onmessage = async event => {
    let msg;

    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }

    if (msg.type === "joined") {
      clientId = msg.clientId;

      localStorage.setItem(
        "video-client-id",
        clientId
      );

      role = msg.role;
      peerPresent = !!msg.peerPresent;

      if (peerPresent) {
        setStatus(
          "Friend found — connecting..."
        );

        if (role === "host") {
          await startCall();
        }
      } else {
        setStatus(
          "Waiting for your friend..."
        );
      }

      return;
    }

    if (msg.type === "peer-joined") {
      peerPresent = true;

      setStatus(
        "Friend joined — connecting..."
      );

      if (role === "host") {
        await startCall();
      }

      return;
    }

    if (msg.type === "peer-reconnected") {
      peerPresent = true;

      if (role === "host") {
        await startCall();
      }

      return;
    }

    if (msg.type === "offer") {
      peerPresent = true;
      await handleOffer(msg.offer);
      return;
    }

    if (msg.type === "answer") {
      await handleAnswer(msg.answer);
      return;
    }

    if (msg.type === "candidate") {
      await handleCandidate(
        msg.candidate
      );
      return;
    }

    if (msg.type === "peer-disconnected") {
      peerPresent = false;

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      remoteVideo.srcObject = null;
      waiting.style.display = "flex";

      setStatus(
        "Waiting for your friend..."
      );

      return;
    }

    if (msg.type === "room-full") {
      setStatus("Room is full.");
    }
  };

  socket.onerror = () => {
    setStatus("Connection error...");
  };

  socket.onclose = () => {
    if (stopped) return;

    setStatus(
      "Disconnected — reconnecting..."
    );

    reconnectTimer =
      setTimeout(
        connectSocket,
        2000
      );
  };
}

// ==========================================
// AUTOMATIC JOIN
// ==========================================

async function start() {
  try {
    setStatus(
      "Starting camera and microphone..."
    );

    await startCamera();

    // Walang Join Room button.
    // Automatic na pumapasok sa main room.
    connectSocket();

  } catch (error) {
    console.error(error);

    setStatus(
      "Camera/microphone permission required."
    );
  }
}

// ==========================================
// MICROPHONE
// ==========================================

micButton.onclick = () => {
  if (!localStream) return;

  const tracks =
    localStream.getAudioTracks();

  tracks.forEach(track => {
    track.enabled = !track.enabled;
  });

  const off =
    tracks.length &&
    !tracks[0].enabled;

  micButton.classList.toggle(
    "off",
    off
  );
};

// ==========================================
// CAMERA
// ==========================================

cameraButton.onclick = () => {
  if (!localStream) return;

  const tracks =
    localStream.getVideoTracks();

  tracks.forEach(track => {
    track.enabled = !track.enabled;
  });

  const off =
    tracks.length &&
    !tracks[0].enabled;

  cameraButton.classList.toggle(
    "off",
    off
  );
};

// Start automatically
start();
</script>

</body>
</html>
