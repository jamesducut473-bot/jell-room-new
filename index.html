<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Jell & James Movie</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ee;
  color: #26352a;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.intro {
  height: 64px;
  background: #dcebdc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #c9dcc9;
}

.logo {
  font-size: 20px;
  font-weight: 700;
}

.room-status {
  font-size: 13px;
  color: #55705b;
}

.main {
  display: grid;
  grid-template-columns:
    minmax(0, 7fr)
    minmax(190px, 3fr);

  gap: 12px;

  padding: 14px;

  max-width: 1700px;

  margin: auto;
}

.movie-card {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.movie-card iframe,
.movie-card video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.movie-placeholder {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  text-align: center;
  padding: 30px;
}

.movie-info {
  background: white;
  border-radius: 14px;
  margin-top: 12px;
  padding: 16px;
}

.movie-title {
  font-size: 21px;
  font-weight: 700;
}

.movie-input {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.movie-input input {
  flex: 1;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
  padding: 11px;
  outline: none;
}

.primary {
  border: 0;
  background: #739b78;
  color: white;
  border-radius: 10px;
  padding: 11px 15px;
}

.side {
  background: white;
  border-radius: 16px;
  padding: 8px;
  min-height: 0;
}

.side-title {
  font-weight: 700;
  padding: 4px 4px 12px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

.video-tile {
  background: #18221b;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
  position: relative;
  min-height: 0;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#localVideo {
  transform: scaleX(-1);
}

.video-off {
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  color: white;
  background: #39483c;
}

.video-name {
  position: absolute;
  left: 8px;
  bottom: 7px;
  background: rgba(0, 0, 0, .6);
  color: white;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 12px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding-top: 12px;
}

.control {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #edf2ed;
  color: #26352a;

  display: flex;
  align-items: center;
  justify-content: center;
}

.control.off {
  background: #c96f6f;
  color: white;
}

.control.end {
  background: #bd5555;
  color: white;
  width: 58px;
  border-radius: 23px;
}

.status {
  font-size: 12px;
  color: #68756b;
  margin-top: 8px;
  text-align: center;
}

@media (max-width: 850px) {

  .main {
    grid-template-columns: 1fr;
  }

  .side {
    min-height: 0;
    padding: 14px;
  }

}

@media (max-width: 850px)
and (orientation: landscape) {

  .main {
    grid-template-columns:
      minmax(0, 7.4fr)
      minmax(120px, 2.6fr);

    gap: 7px;
    padding: 7px;

    height: calc(100dvh - 64px);
    max-height: calc(100dvh - 64px);

    overflow: hidden;
  }

  .movie-card {
    height: 100%;
    aspect-ratio: auto;
    border-radius: 10px;
  }

  .movie-info {
    display: none;
  }

  .side {
    padding: 5px;
    border-radius: 9px;

    height: 100%;
    max-height: 100%;

    display: flex;
    flex-direction: column;

    overflow: hidden;
  }

  .side-title {
    font-size: 10px;
    line-height: 14px;
    padding: 0 2px 3px;
  }

  .video-grid {
    flex: 1;
    min-height: 0;

    grid-template-rows:
      repeat(2, minmax(0, 1fr));

    gap: 4px;

    overflow: hidden;
  }

  .video-tile {
    height: 100%;
    max-height: 100%;
    aspect-ratio: auto;
    border-radius: 6px;
  }

  .video-name {
    font-size: 8px;
    left: 4px;
    bottom: 3px;
    padding: 2px 4px;
  }

  .controls {
    padding-top: 4px;
    gap: 4px;
  }

  .control {
    width: 26px;
    height: 26px;
  }

  .control.end {
    width: 34px;
    border-radius: 13px;
  }

}

@media (max-width: 520px)
and (orientation: portrait) {

  .video-grid {
    grid-template-columns: 1fr;
  }

  .video-tile {
    aspect-ratio: 16 / 9;
  }

}

</style>

</head>

<body>

<div class="intro">

  <div class="logo">
    Jell & James Movie
  </div>

  <div
    class="room-status"
    id="roomStatus"
  >
    Connecting...
  </div>

</div>

<main class="main">

  <section>

    <div
      class="movie-card"
      id="movieContainer"
    >

      <div class="movie-placeholder">
        Paste a movie/video URL below to start watching.
      </div>

    </div>

    <div class="movie-info">

      <div class="movie-title">
        Watch Together
      </div>

      <div class="movie-input">

        <input
          id="movieUrl"
          placeholder="Paste YouTube or video URL..."
        >

        <button
          class="primary"
          onclick="loadMovie()"
        >
          Play
        </button>

      </div>

    </div>

  </section>


  <aside class="side">

    <div class="side-title">
      Video Call
    </div>

    <div
      class="video-grid"
      id="videoGrid"
    >

      <div
        class="video-tile"
        id="localTile"
      >

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div
          class="video-off"
          id="localOff"
        >
          Camera Off
        </div>

        <div class="video-name">
          You
        </div>

      </div>

    </div>

    <div class="controls">

      <button
        class="control"
        id="micButton"
        onclick="toggleMic()"
      >
        🎙️
      </button>

      <button
        class="control"
        id="cameraButton"
        onclick="toggleCamera()"
      >
        📹
      </button>

      <button
        class="control end"
        onclick="leaveRoom()"
      >
        ✕
      </button>

    </div>

    <div
      class="status"
      id="connectionStatus"
    >
      Connecting...
    </div>

  </aside>

</main>


<script>

/*
=========================================================
ONE ROOM ONLY
=========================================================
*/

const SIGNALING_SERVER =
  "wss://jell-room-new.onrender.com";

const ONE_ROOM =
  "main";


/*
=========================================================
CLIENT ID
=========================================================
*/

let clientId =
  localStorage.getItem(
    "jell-client-id"
  );

if (!clientId) {

  clientId =
    "client-" +
    crypto.randomUUID();

  localStorage.setItem(
    "jell-client-id",
    clientId
  );

}


/*
=========================================================
STATE
=========================================================
*/

let ws = null;

let pc = null;

let localStream = null;

let isHost = false;

let peerPresent = false;

let remoteDescriptionSet = false;

let pendingCandidates = [];

let makingOffer = false;

let reconnectTimer = null;

let offerRetryTimer = null;

let connectionRetryCount = 0;

let lastMovieUrl = "";

let movieState = {
  currentTime: 0,
  paused: true,
  playbackRate: 1,
  volume: 1,
  updatedAt: Date.now()
};

let activeMovieElement = null;

let youtubePlayer = null;

let movieSyncTimer = null;

let suppressMovieSync = false;


/*
=========================================================
STATUS
=========================================================
*/

function setStatus(text) {

  const status =
    document.getElementById(
      "connectionStatus"
    );

  const roomStatus =
    document.getElementById(
      "roomStatus"
    );

  if (status) {
    status.textContent = text;
  }

  if (roomStatus) {
    roomStatus.textContent = text;
  }

}


/*
=========================================================
START
=========================================================
*/

window.addEventListener(
  "load",
  () => {

    startCamera();

    connectSignaling();

  }
);


/*
=========================================================
CAMERA + MICROPHONE
=========================================================
*/

async function startCamera() {

  if (localStream) {
    return localStream;
  }

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }
        },

        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }

      });


    const video =
      document.getElementById(
        "localVideo"
      );

    video.srcObject =
      localStream;

    video.muted = true;

    video.playsInline = true;

    video.play().catch(() => {});


    if (pc) {
      addLocalTracks();
    }


    setStatus(
      peerPresent
        ? "Camera ready — connecting..."
        : "Waiting for another person..."
    );


    return localStream;

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    setStatus(
      "Allow camera and microphone permission."
    );

    return null;

  }

}


/*
=========================================================
SIGNALING
=========================================================
*/

function connectSignaling() {

  if (
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }


  setStatus(
    "Connecting to the only room..."
  );


  ws =
    new WebSocket(
      SIGNALING_SERVER
    );


  ws.onopen = () => {

    console.log(
      "Signaling connected."
    );


    /*
     * IMPORTANT:
     * No room supplied by user.
     * Server decides the only room.
     */

    sendSignal({

      type: "join",

      room: ONE_ROOM,

      clientId

    });


    setStatus(
      "Joining the room..."
    );

  };


  ws.onmessage =
    async event => {

      let data;

      try {

        data =
          JSON.parse(
            event.data
          );

      } catch {

        return;

      }


      /*
      =========================================
      JOINED
      =========================================
      */

      if (data.type === "joined") {

        isHost =
          data.role === "host";

        peerPresent =
          !!data.peerPresent;


        if (data.movie) {

          lastMovieUrl =
            data.movie.url || "";

          movieState =
            data.movie.state || movieState;


          if (lastMovieUrl) {

            renderMovie(
              lastMovieUrl
            );

            setTimeout(
              () => {

                syncMovieState(
                  movieState,
                  true
                );

              },
              1000
            );

          }

        }


        if (peerPresent) {

          setStatus(
            "Someone is here — connecting..."
          );

          if (isHost) {

            await waitForCamera();

            await rebuildConnection();

            await createOffer(
              true
            );

          }

        } else {

          setStatus(
            "You're in the room — waiting for someone..."
          );

        }


        return;
      }


      /*
      =========================================
      SECOND USER ARRIVED
      =========================================
      */

      if (
        data.type === "peer-joined" ||
        data.type === "peer-rejoined"
      ) {

        peerPresent = true;


        setStatus(
          "Someone joined — connecting video..."
        );


        /*
         * HOST ALWAYS CREATES THE OFFER.
         * This prevents offer collision.
         */

        if (isHost) {

          await waitForCamera();

          await rebuildConnection();

          await createOffer(
            true
          );

        }


        return;
      }


      /*
      =========================================
      OFFER
      =========================================
      */

      if (data.type === "offer") {

        peerPresent = true;

        await receiveOffer(
          data.offer
        );

        return;
      }


      /*
      =========================================
      ANSWER
      =========================================
      */

      if (data.type === "answer") {

        await receiveAnswer(
          data.answer
        );

        return;
      }


      /*
      =========================================
      ICE
      =========================================
      */

      if (data.type === "candidate") {

        await receiveCandidate(
          data.candidate
        );

        return;
      }


      /*
      =========================================
      ROOM FULL
      =========================================
      */

      if (data.type === "room-full") {

        peerPresent = false;

        setStatus(
          "Room is full — only 2 people are allowed."
        );

        return;
      }


      /*
      =========================================
      PEER LEFT
      =========================================
      */

      if (data.type === "peer-left") {

        peerPresent = false;

        clearOfferRetry();

        closePeerConnection();

        removeGuestVideo();


        setStatus(
          "Someone left — waiting for the next connection..."
        );

        return;
      }


      /*
      =========================================
      MOVIE
      =========================================
      */

      if (data.type === "movie") {

        if (data.url) {

          lastMovieUrl =
            data.url;

          movieState =
            data.state || movieState;


          renderMovie(
            data.url
          );


          setTimeout(
            () => {

              syncMovieState(
                movieState,
                true
              );

            },
            800
          );

        }

        return;
      }


      /*
      =========================================
      MOVIE STATE
      =========================================
      */

      if (
        data.type === "movie-state"
      ) {

        if (
          data.url &&
          data.url !== lastMovieUrl
        ) {

          lastMovieUrl =
            data.url;

          renderMovie(
            data.url
          );

        }


        if (data.state) {

          movieState = {
            ...movieState,
            ...data.state
          };


          syncMovieState(
            {
              ...movieState,
              updatedAt:
                data.updatedAt
            }
          );

        }

        return;
      }


      /*
      =========================================
      ERROR
      =========================================
      */

      if (data.type === "error") {

        setStatus(
          data.message ||
          "Server error."
        );

      }

    };


  ws.onerror = error => {

    console.error(
      "WebSocket error:",
      error
    );

    setStatus(
      "Connection error — retrying..."
    );

  };


  ws.onclose = () => {

    console.log(
      "Signaling disconnected."
    );


    setStatus(
      "Reconnecting..."
    );


    clearTimeout(
      reconnectTimer
    );


    reconnectTimer =
      setTimeout(
        connectSignaling,
        1500
      );

  };

}


/*
=========================================================
SEND SIGNAL
=========================================================
*/

function sendSignal(data) {

  if (
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ) {
    return false;
  }

  try {

    ws.send(
      JSON.stringify(data)
    );

    return true;

  } catch (error) {

    console.error(
      "Signal send error:",
      error
    );

    return false;

  }

}


/*
=========================================================
PEER CONNECTION
=========================================================
*/

function createPeerConnection() {

  if (pc) {
    return pc;
  }


  pc =
    new RTCPeerConnection({

      iceServers: [

        {
          urls: [
            "stun:stun.l.google.com:19302",
            "stun:stun1.l.google.com:19302",
            "stun:stun2.l.google.com:19302"
          ]
        }

      ],

      bundlePolicy:
        "max-bundle",

      rtcpMuxPolicy:
        "require"

    });


  remoteDescriptionSet =
    false;

  pendingCandidates =
    [];


  addLocalTracks();


  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        sendSignal({

          type: "candidate",

          room: ONE_ROOM,

          candidate:
            event.candidate

        });

      }

    };


  pc.ontrack =
    event => {

      if (
        !event.streams ||
        !event.streams[0]
      ) {
        return;
      }


      addGuestVideo(
        event.streams[0]
      );

    };


  pc.onconnectionstatechange =
    () => {

      if (!pc) {
        return;
      }


      const state =
        pc.connectionState;


      console.log(
        "WebRTC connection:",
        state
      );


      if (state === "connected") {

        connectionRetryCount =
          0;

        clearOfferRetry();

        setStatus(
          "Connected ✓"
        );

        return;
      }


      if (
        state === "disconnected" ||
        state === "failed"
      ) {

        setStatus(
          "Video connection lost — reconnecting..."
        );


        if (isHost) {
          scheduleOfferRetry();
        }

      }

    };


  pc.oniceconnectionstatechange =
    () => {

      if (!pc) {
        return;
      }


      const state =
        pc.iceConnectionState;


      if (
        state === "failed" ||
        state === "disconnected"
      ) {

        if (isHost) {
          scheduleOfferRetry();
        }

      }

    };


  return pc;

}


/*
=========================================================
ADD LOCAL TRACKS
=========================================================
*/

function addLocalTracks() {

  if (
    !pc ||
    !localStream
  ) {
    return;
  }


  const senders =
    pc.getSenders();


  for (
    const track of
    localStream.getTracks()
  ) {

    const existing =
      senders.find(
        sender =>
          sender.track &&
          sender.track.kind ===
          track.kind
      );


    if (existing) {

      if (
        existing.track !==
        track
      ) {

        existing.replaceTrack(
          track
        );

      }

    } else {

      pc.addTrack(
        track,
        localStream
      );

    }

  }

}


/*
=========================================================
WAIT CAMERA
=========================================================
*/

async function waitForCamera() {

  if (localStream) {
    return true;
  }

  const stream =
    await startCamera();

  return !!stream;

}


/*
=========================================================
REBUILD CONNECTION
=========================================================
*/

async function rebuildConnection() {

  closePeerConnection();

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        150
      )
  );

  createPeerConnection();

}


/*
=========================================================
CREATE OFFER
=========================================================
*/

async function createOffer(
  iceRestart = false
) {

  if (
    !isHost ||
    !peerPresent ||
    makingOffer
  ) {
    return;
  }


  if (
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ) {
    return;
  }


  makingOffer =
    true;


  try {

    createPeerConnection();

    addLocalTracks();


    const offer =
      await pc.createOffer({
        iceRestart
      });


    await pc.setLocalDescription(
      offer
    );


    sendSignal({

      type: "offer",

      room: ONE_ROOM,

      offer:
        pc.localDescription

    });


    setStatus(
      "Connecting video..."
    );


    scheduleOfferRetry();

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  } finally {

    makingOffer =
      false;

  }

}


/*
=========================================================
OFFER RETRY
=========================================================
*/

function scheduleOfferRetry() {

  clearOfferRetry();


  offerRetryTimer =
    setTimeout(
      async () => {

        if (
          peerPresent &&
          isHost &&
          pc &&
          pc.connectionState !==
            "connected"
        ) {

          connectionRetryCount++;


          if (
            connectionRetryCount <=
            10
          ) {

            await rebuildConnection();

            await createOffer(
              true
            );

          }

        }

      },
      3000
    );

}


function clearOfferRetry() {

  if (
    offerRetryTimer
  ) {

    clearTimeout(
      offerRetryTimer
    );

    offerRetryTimer =
      null;

  }

}


/*
=========================================================
RECEIVE OFFER
=========================================================
*/

async function receiveOffer(
  offer
) {

  try {

    await waitForCamera();


    if (!pc) {
      createPeerConnection();
    }


    addLocalTracks();


    if (
      pc.signalingState !==
        "stable" &&
      pc.remoteDescription
    ) {

      closePeerConnection();

      createPeerConnection();

      await waitForCamera();

      addLocalTracks();

    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );


    remoteDescriptionSet =
      true;


    await flushPendingCandidates();


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    sendSignal({

      type: "answer",

      room: ONE_ROOM,

      answer:
        pc.localDescription

    });


    setStatus(
      "Connecting video..."
    );

  } catch (error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


/*
=========================================================
RECEIVE ANSWER
=========================================================
*/

async function receiveAnswer(
  answer
) {

  if (!pc) {
    return;
  }


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );


    remoteDescriptionSet =
      true;


    await flushPendingCandidates();

  } catch (error) {

    console.error(
      "Answer error:",
      error
    );


    if (isHost) {

      await rebuildConnection();

      await createOffer(
        true
      );

    }

  }

}


/*
=========================================================
ICE
=========================================================
*/

async function receiveCandidate(
  candidate
) {

  if (
    !pc ||
    !remoteDescriptionSet
  ) {

    pendingCandidates.push(
      candidate
    );

    return;

  }


  try {

    await pc.addIceCandidate(
      candidate
    );

  } catch (error) {

    console.warn(
      "ICE candidate error:",
      error
    );

  }

}


async function flushPendingCandidates() {

  if (
    !pc ||
    !remoteDescriptionSet
  ) {
    return;
  }


  const candidates =
    pendingCandidates.slice();


  pendingCandidates =
    [];


  for (
    const candidate of
    candidates
  ) {

    try {

      await pc.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.warn(
        "Queued ICE error:",
        error
      );

    }

  }

}


/*
=========================================================
CLOSE PEER
=========================================================
*/

function closePeerConnection() {

  if (pc) {

    try {

      pc.ontrack =
        null;

      pc.onicecandidate =
        null;

      pc.close();

    } catch {}

  }


  pc = null;

  pendingCandidates =
    [];

  remoteDescriptionSet =
    false;

  makingOffer =
    false;

}

=========================================================
GUEST VIDEO
=========================================================
*/

function addGuestVideo(
  stream
) {

      "guestTile"
    );


  if (!tile) {

      );

    tile.className =

    tile.id =

    const video =
      document.createElement(
        "video"
      );

    video.autoplay =
      true;

    video.playsInline =
      true;

    video.srcObject =
      stream;

    video.volume =
      1;


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "video-name";

    name.textContent =
      "Friend";


    tile.appendChild(
      video
    );

    tile.appendChild(
      name
    );

      .getElementById(

      )
      .appendChild(

      );

  } else {

      tile.querySelector(

      );

      video.play().catch(

      );

    }

/*
=========================================================
MIC
=========================================================
*/

function toggleMic() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getAudioTracks();


  if (!tracks.length) {
    return;
  }


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track => {
      track.enabled =
        !enabled;
    }
  );


  document
    .getElementById(
      "micButton"
    )
    .classList.toggle(
      "off",
      enabled
    );

}


/*

CAMERA

function toggleCamera() {

  if (!localStream) {

  const tracks =
    localStream.getVideoTracks();


  if (!tracks.length) {

  const enabled =

/*
=========================================================
MOVIE
=========================================================
*/

function getYouTubeId(url) {

  const match =
    String(url)
      .match(
        /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
      );

  return match
    ? match[1]
    : null;

}


function renderMovie(url) {

  url =
    String(url || "")
      .trim();


  if (!url) {
    return;
  }


  const container =
    document.getElementById(
      "movieContainer"
    );


  if (
    container.dataset.movieUrl ===
      url &&
    container.querySelector(
      "iframe, video"
    )
  ) {

    return;

  }


  container.dataset.movieUrl =
    url;


  activeMovieElement =
    null;

  youtubePlayer =
    null;


  if (movieSyncTimer) {

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer =
      null;

  }


  const youtubeId =
    getYouTubeId(
      url
    );


  if (youtubeId) {

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.id =
      "youtubePlayer";

    iframe.src =
      "https://www.youtube.com/embed/" +
      youtubeId +
      "?enablejsapi=1&rel=0";

    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";

    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";

    container.appendChild(
      iframe
    );


    createYouTubePlayer(
      iframe
    );


    return;

  }


  const video =
    document.createElement(
      "video"
    );


  video.src =
    url;

  video.controls =
    true;

  video.playsInline =
    true;

  video.preload =
    "metadata";


  container.innerHTML =
    "";

  container.appendChild(
    video
  );


  activeMovieElement =
    video;


  const events = [
    "play",
    "pause",
    "seeked",
    "ratechange",
    "volumechange"
  ];


  events.forEach(
    eventName => {

      video.addEventListener(
        eventName,
        sendMovieState
      );

    }
  );


  movieSyncTimer =
    setInterval(
      () => {

        if (
          !suppressMovieSync &&
          !video.paused
        ) {

          sendMovieState();

        }

      },
      700
    );

}


/*
=========================================================
YOUTUBE PLAYER
=========================================================
*/

function createYouTubePlayer(
  iframe
) {

  const start =
    () => {

      if (
        !window.YT ||
        !window.YT.Player
      ) {
        return;
      }


      try {

        youtubePlayer =
          new YT.Player(
            iframe,
            {

              events: {

                onReady: () => {

                  syncMovieState(
                    movieState,
                    true
                  );


                  movieSyncTimer =
                    setInterval(
                      () => {

                        if (
                          !suppressMovieSync &&
                          youtubePlayer &&
                          youtubePlayer
                            .getPlayerState &&
                          youtubePlayer
                            .getPlayerState()
                            ===
                            YT.PlayerState.PLAYING
                        ) {

                          sendMovieState();

                        }

                      },
                      700
                    );

                },


                onStateChange:
                  event => {

                    if (
                      suppressMovieSync
                    ) {
                      return;
                    }


                    if (
                      event.data ===
                        YT.PlayerState.PLAYING ||
                      event.data ===
                        YT.PlayerState.PAUSED
                    ) {

                      sendMovieState();

                    }

                  }

              }

            }
          );

      } catch (error) {

        console.error(
          "YouTube error:",
          error
        );

      }

    };


  if (
    window.YT &&
    window.YT.Player
  ) {

    start();

  } else {

    window.onYouTubeIframeAPIReady =
      start;

  }

}


/*
=========================================================
YOUTUBE API
=========================================================
*/

const ytScript =
  document.createElement(
    "script"
  );

ytScript.src =
  "https://www.youtube.com/iframe_api";

document.head.appendChild(
  ytScript
);


/*
=========================================================
GET MOVIE STATE
=========================================================
*/

function getMovieState() {

  try {

    if (
      youtubePlayer &&
      youtubePlayer.getCurrentTime
    ) {

      return {

        currentTime:
          Number(
            youtubePlayer
              .getCurrentTime() || 0
          ),

        paused:
          youtubePlayer
            .getPlayerState() !== 1,

        playbackRate:
          Number(
            youtubePlayer
              .getPlaybackRate() || 1
          ),

        volume:
          Number(
            youtubePlayer
              .getVolume() || 100
          ) / 100

      };

    }


    if (activeMovieElement) {

      return {

        currentTime:
          Number(
            activeMovieElement
              .currentTime || 0
          ),

        paused:
          activeMovieElement.paused,

        playbackRate:
          Number(
            activeMovieElement
              .playbackRate || 1
          ),

        volume:
          Number(
            activeMovieElement
              .volume || 1
          )

      };

    }

  } catch (error) {

    console.warn(
      "Movie state error:",
      error
    );

  }


  return null;

}


/*
=========================================================
SEND MOVIE STATE
=========================================================
*/

function sendMovieState() {

  if (
    suppressMovieSync ||
    !ws ||
    ws.readyState !==
      WebSocket.OPEN
  ) {
    return;
  }


  const state =
    getMovieState();


  if (!state) {
    return;
  }


  movieState =
    state;


  sendSignal({

    type: "movie-state",

    room: ONE_ROOM,

    url: lastMovieUrl,

    state,

    updatedAt:
      Date.now()

  });

}


/*
=========================================================
SYNC MOVIE
=========================================================
*/

function syncMovieState(
  state,
  initial = false
) {

  if (!state) {
    return;
  }


  suppressMovieSync =
    true;


  let targetTime =
    Number(
      state.currentTime || 0
    );


  if (
    !state.paused &&
    state.updatedAt
  ) {

    const elapsed =
      Math.max(
        0,
        (
          Date.now() -
          Number(
            state.updatedAt
          )
        ) / 1000
      );


    targetTime +=
      elapsed *
      Number(
        state.playbackRate || 1
      );

  }


  try {

    if (
      youtubePlayer &&
      youtubePlayer.seekTo
    ) {

      youtubePlayer.seekTo(
        targetTime,
        true
      );


      if (
        youtubePlayer.setPlaybackRate &&
        state.playbackRate
      ) {

        youtubePlayer.setPlaybackRate(
          Number(
            state.playbackRate
          )
        );

      }


      if (
        youtubePlayer.setVolume &&
        typeof state.volume ===
          "number"
      ) {

        youtubePlayer.setVolume(
          Math.round(
            state.volume * 100
          )
        );

      }


      if (state.paused) {

        youtubePlayer.pauseVideo();

      } else {

        youtubePlayer.playVideo();

      }

    } else if (
      activeMovieElement
    ) {

      activeMovieElement.currentTime =
        targetTime;


      if (
        state.playbackRate
      ) {

        activeMovieElement
          .playbackRate =
          Number(
            state.playbackRate
          );

      }


      if (
        typeof state.volume ===
          "number"
      ) {

        activeMovieElement.volume =
          Math.max(
            0,
            Math.min(
              1,
              Number(
                state.volume
              )
            )
          );

      }


      if (state.paused) {

        activeMovieElement.pause();

      } else {

        activeMovieElement
          .play()
          .catch(
            () => {}
          );

      }

    }

  } catch (error) {

    console.warn(
      "Movie sync error:",
      error
    );

  }


  setTimeout(
    () => {
      suppressMovieSync =
        false;
    },
    initial ? 600 : 250
  );

}


/*
=========================================================
LOAD MOVIE
=========================================================
*/

function loadMovie() {

  const input =
    document.getElementById(
      "movieUrl"
    );


  const url =
    String(
      input.value || ""
    ).trim();


  if (!url) {

    setStatus(
      "Enter a movie/video URL."
    );

    return;

  }


  lastMovieUrl =
    url;


  movieState = {

    currentTime: 0,

    paused: true,

    playbackRate: 1,

    volume: 1,

    updatedAt:
      Date.now()

  };


  renderMovie(
    url
  );


  sendSignal({

    type: "movie",

    room: ONE_ROOM,

    url,

    state: movieState

  });


  setStatus(
    "Movie loaded."
  );

}


/*
=========================================================
LEAVE
=========================================================
*/

function leaveRoom() {

  clearOfferRetry();

  clearTimeout(
    reconnectTimer
  );


  if (movieSyncTimer) {

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer =
      null;

  }


  closePeerConnection();


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {
          track.stop();
        }
      );

    localStream =
      null;

  }


  if (ws) {

    try {
      ws.close();
    } catch {}

  }


  location.reload();

}
