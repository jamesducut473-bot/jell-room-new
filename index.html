<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jell & James Movie</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef5ee;
  color:#26352a;
}
button,input{font:inherit}
button{cursor:pointer}

.start-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.start-card{
  width:min(420px,100%);
  background:#fff;
  border-radius:22px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 10px 35px rgba(40,70,45,.12);
}
.start-title{font-size:28px;font-weight:700;margin-bottom:8px}
.start-subtitle{color:#718073;font-size:14px;margin-bottom:25px}
.start-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  background:#739b78;
  color:#fff;
  font-weight:700;
}
.start-button.secondary{background:#edf3ed;color:#456049}
.join-area{display:none;margin-top:14px}
.join-area input{
  width:100%;
  border:1px solid #ccd8cc;
  border-radius:10px;
  padding:12px;
  outline:none;
}

.intro{
  height:64px;
  background:#dcebdc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #c9dcc9;
  transition:.5s;
}
.intro.hidden{
  height:0;
  opacity:0;
  padding:0;
  border:0;
  overflow:hidden;
}
.logo{font-size:20px;font-weight:700}
.room-status{font-size:13px;color:#55705b}

.main{
  display:grid;
  grid-template-columns:minmax(0,7fr) minmax(190px,3fr);
  gap:12px;
  padding:14px;
  max-width:1700px;
  margin:auto;
}
.movie-card{
  background:#000;
  border-radius:16px;
  overflow:hidden;
  aspect-ratio:16/9;
}
.movie-card iframe,
.movie-card video{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.movie-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  text-align:center;
  padding:30px;
}
.movie-info{
  background:#fff;
  border-radius:14px;
  margin-top:12px;
  padding:16px;
}
.movie-title{font-size:21px;font-weight:700}
.movie-input{display:flex;gap:8px;margin-top:12px}
.movie-input input{
  flex:1;
  border:1px solid #ccd8cc;
  border-radius:10px;
  padding:11px;
  outline:none;
}
.primary{
  border:0;
  background:#739b78;
  color:#fff;
  border-radius:10px;
  padding:11px 15px;
}

.side{
  background:#fff;
  border-radius:16px;
  padding:8px;
  min-height:0;
}
.side-title{font-weight:700;padding:4px 4px 12px}
.video-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.video-tile{
  background:#18221b;
  border-radius:14px;
  overflow:hidden;
  aspect-ratio:16/9;
  position:relative;
}
.video-tile video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#localVideo{transform:scaleX(-1)}
.video-name{
  position:absolute;
  left:8px;
  bottom:7px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:4px 7px;
  border-radius:6px;
  font-size:12px;
}
.video-off{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:#39483c;
}

.controls{
  display:flex;
  justify-content:center;
  gap:9px;
  padding-top:12px;
}
.control{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#edf2ed;
  color:#26352a;
  display:flex;
  align-items:center;
  justify-content:center;
}
.control.off{background:#c96f6f;color:#fff}
.control.end{
  background:#bd5555;
  color:#fff;
  width:58px;
  border-radius:23px;
}
.icon{width:21px;height:21px}

.invite-box{
  background:#f4f8f4;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}
.invite-label{
  font-size:12px;
  color:#647366;
  margin-bottom:7px;
}
.invite-row{display:flex;gap:7px}
.invite-row input{
  min-width:0;
  flex:1;
  border:1px solid #ccd8cc;
  border-radius:8px;
  padding:9px;
  font-size:12px;
}
.small-button{
  border:0;
  border-radius:8px;
  padding:9px 10px;
  background:#739b78;
  color:#fff;
}
.status,.people{
  font-size:12px;
  color:#68756b;
  margin-top:8px;
}

@media(max-width:850px){
  .main{grid-template-columns:1fr}
  .side{min-height:0;padding:14px}
  .video-grid{grid-template-columns:1fr;gap:12px}
}

@media(max-width:850px) and (orientation:landscape){
  .main{
    grid-template-columns:minmax(0,7.4fr) minmax(120px,2.6fr);
    gap:7px;
    padding:7px;
    height:calc(100dvh - 64px);
    max-height:calc(100dvh - 64px);
    overflow:hidden;
  }
  .main>section{min-width:0;min-height:0}
  .movie-card{
    height:100%;
    aspect-ratio:auto;
    border-radius:10px;
  }
  .movie-info{display:none}
  .side{
    padding:5px;
    border-radius:9px;
    height:100%;
    max-height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .side-title{
    font-size:10px;
    line-height:14px;
    padding:0 2px 3px;
    flex:0 0 17px;
  }
  .video-grid{
    flex:1 1 auto;
    min-height:0;
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:4px;
    overflow:hidden;
  }
  .video-tile{
    min-height:0;
    height:100%;
    max-height:100%;
    aspect-ratio:auto;
    border-radius:6px;
  }
  .video-name{
    font-size:8px;
    left:4px;
    bottom:3px;
    padding:2px 4px;
  }
  .controls{
    padding-top:4px;
    gap:4px;
    flex:0 0 31px;
  }
  .control{width:26px;height:26px}
  .control.end{width:34px;border-radius:13px}
  .invite-box,.status,.people{display:none}
}

@media(max-width:520px) and (orientation:portrait){
  .video-grid{grid-template-columns:1fr}
  .video-tile{aspect-ratio:16/9}
}
</style>
</head>

<body>

<div class="start-screen" id="startScreen">
  <div class="start-card">
    <div class="start-title">Jell & James Movie</div>
    <div class="start-subtitle">Watch together with someone</div>

    <button class="start-button" onclick="makeRoom()">
      Make Room
    </button>

    <button class="start-button secondary" onclick="showJoin()">
      Join Room
    </button>

    <div class="join-area" id="joinArea">
      <input id="joinInput" placeholder="Paste invitation link or room ID">
      <button class="start-button" onclick="joinRoom()">Join</button>
    </div>
  </div>
</div>

<div id="watchRoom" style="display:none">

  <div class="intro" id="intro">
    <div class="logo">Jell & James Movie</div>
    <div class="room-status" id="roomStatus">Room ready</div>
  </div>

  <main class="main">

    <section>

      <div class="movie-card" id="movieContainer">
        <div class="movie-placeholder">
          Paste a movie/video URL below to start watching.
        </div>
      </div>

      <div class="movie-info">
        <div class="movie-title">Watch Together</div>

        <div class="movie-input">
          <input
            id="movieUrl"
            placeholder="Paste YouTube, Vimeo or video URL..."
          >
          <button class="primary" onclick="loadMovie()">Play</button>
        </div>
      </div>

    </section>

    <aside class="side">

      <div class="side-title">Video Call</div>

      <div class="video-grid" id="videoGrid">

        <div class="video-tile" id="localTile">

          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>

          <div class="video-off" id="localOff">
            Camera Off
          </div>

          <div class="video-name">You</div>

        </div>

      </div>

      <div class="controls">

        <button
          class="control"
          id="micButton"
          onclick="toggleMic()"
          title="Mute"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 10a7 7 0 0 0 14 0"/>
            <path d="M12 17v5"/>
            <path d="M8 22h8"/>
          </svg>
        </button>

        <button
          class="control"
          id="cameraButton"
          onclick="toggleCamera()"
          title="Turn camera off"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M15 10l4-3v10l-4-3"/>
            <rect x="3" y="6" width="12" height="12" rx="2"/>
          </svg>
        </button>

        <button
          class="control end"
          onclick="leaveRoom()"
          title="Leave room"
        >
          ✕
        </button>

      </div>

      <div class="invite-box">

        <div class="invite-label">Room invitation</div>

        <div class="invite-row">
          <input id="inviteLink" readonly>
          <button class="small-button" onclick="copyInvite()">
            Copy
          </button>
        </div>

        <div class="status" id="connectionStatus">
          Starting room...
        </div>

      </div>

      <div class="people" id="peopleCount">
        1 person in room
      </div>

    </aside>

  </main>

</div>

<script>

const SIGNALING_SERVER =
  "wss://jell-room-new.onrender.com";

const AUTO_ROOM_ID = "jell-auto-room";

let ws = null;
let pc = null;
let localStream = null;

let roomId = null;
let isHost = false;

let peerPresent = false;

let pendingCandidates = [];
let remoteDescriptionSet = false;
let makingOffer = false;

let lastMovieUrl = "";
let movieState = {
  currentTime:0,
  paused:true,
  playbackRate:1,
  volume:1
};

let movieSyncTimer = null;
let suppressMovieSync = false;

let activeMovieType = null;
let activeMovieElement = null;

let youtubePlayer = null;
let vimeoPlayer = null;


/* =========================
   YOUTUBE API
========================= */

if(!document.getElementById("youtube-api")){

  const ytScript =
    document.createElement("script");

  ytScript.id =
    "youtube-api";

  ytScript.src =
    "https://www.youtube.com/iframe_api";

  document.head.appendChild(
    ytScript
  );

}


/* =========================
   START SCREEN
========================= */

function showJoin(){

  document.getElementById(
    "joinArea"
  ).style.display =
    "block";

}


/* =========================
   MAKE ROOM
========================= */

function makeRoom(){

  roomId =
    "jell-" +
    Math.random()
      .toString(36)
      .substring(2,10);

  isHost = true;

  openRoom();

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom(){

  const value =
    document.getElementById(
      "joinInput"
    ).value.trim();

  if(!value){

    alert(
      "Paste an invitation link or room ID."
    );

    return;

  }

  try{

    const url =
      new URL(value);

    const room =
      url.searchParams.get("room");

    roomId =
      room || value;

  }catch{

    roomId = value;

  }

  isHost = false;

  openRoom();

}


/* =========================
   OPEN ROOM
========================= */

function openRoom(){

  if(!roomId){

    setStatus("Invalid room ID");

    return;

  }

  const roomUrl =
    new URL(
      window.location.href
    );

  roomUrl.search = "";

  roomUrl.searchParams.set(
    "room",
    roomId
  );

  history.replaceState(
    {},
    "",
    roomUrl.pathname +
    "?" +
    roomUrl.searchParams.toString()
  );

  document.getElementById(
    "startScreen"
  ).style.display =
    "none";

  document.getElementById(
    "watchRoom"
  ).style.display =
    "block";

  updateInvite();

  connectSignaling();

  startCamera();

}


/* =========================
   INVITE
========================= */

function updateInvite(){

  document.getElementById(
    "inviteLink"
  ).value =
    location.origin +
    location.pathname +
    "?room=" +
    encodeURIComponent(roomId);

}


async function copyInvite(){

  const input =
    document.getElementById(
      "inviteLink"
    );

  try{

    await navigator.clipboard.writeText(
      input.value
    );

  }catch{

    input.select();

    document.execCommand(
      "copy"
    );

  }

  setStatus(
    "Invitation link copied"
  );

}


/* =========================
   STATUS
========================= */

function setStatus(text){

  const status =
    document.getElementById(
      "connectionStatus"
    );

  const roomStatus =
    document.getElementById(
      "roomStatus"
    );

  if(status)
    status.textContent = text;

  if(roomStatus)
    roomStatus.textContent = text;

}


/* =========================
   CAMERA + AUDIO
========================= */

async function startCamera(options={}){

  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera/microphone API unavailable."
      );

    }

    /*
      IMPORTANT AUDIO FIX

      These settings tell the browser that this
      microphone is being used for normal speech.

      Echo cancellation:
      prevents the other person's voice from
      feeding back into the microphone.

      Noise suppression:
      reduces background noise.

      Auto gain:
      keeps voice level stable.

      Mono:
      avoids unnecessary stereo processing
      for a voice call.
    */
    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30,max:30}
        },

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1,
          sampleRate:48000,
          sampleSize:16
        }

      });


    const localVideo =
      document.getElementById(
        "localVideo"
      );

    if(localVideo){

      localVideo.srcObject =
        localStream;

      localVideo.muted =
        true;

      localVideo.playsInline =
        true;

      try{

        await localVideo.play();

      }catch{}

    }


    /*
      Tell the browser this audio is speech.
    */
    localStream
      .getAudioTracks()
      .forEach(track=>{

        track.enabled = true;

        try{

          track.contentHint =
            "speech";

        }catch{}

      });


    setStatus(
      isHost
      ? "Room ready — camera ready"
      : "Joined room — camera ready"
    );


    if(pc){

      addLocalTracks();

      /*
        Replace the audio sender's track if one
        already exists.
      */
      const audioTrack =
        localStream
          .getAudioTracks()[0];

      if(audioTrack){

        const audioSender =
          pc.getSenders().find(
            sender =>
              sender.track &&
              sender.track.kind === "audio"
          );

        if(audioSender){

          try{

            await audioSender.replaceTrack(
              audioTrack
            );

          }catch(error){

            console.warn(
              "Audio replace failed:",
              error
            );

          }

        }

      }


      /*
        Apply voice-friendly Opus settings
        when the browser exposes them.
      */
      optimizeAudioSender();


      if(
        peerPresent &&
        !options.skipRenegotiation
      ){

        await createOffer();

      }

    }

    return localStream;

  }catch(error){

    console.error(
      "Camera/microphone error:",
      error
    );

    setStatus(
      isHost
      ? "Room ready — camera/mic permission needed"
      : "Joined room — camera/mic permission needed"
    );

    return null;

  }

}


/* =========================
   AUDIO SENDER OPTIMIZATION
========================= */

function optimizeAudioSender(){

  if(!pc) return;

  const sender =
    pc.getSenders().find(
      s =>
        s.track &&
        s.track.kind === "audio"
    );

  if(!sender) return;

  try{

    const params =
      sender.getParameters();

    if(!params.encodings){
      params.encodings = [{}];
    }

    /*
      A stable voice bitrate.
      This helps avoid excessive audio
      compression while keeping bandwidth low.
    */
    params.encodings[0].maxBitrate =
      32000;

    sender.setParameters(
      params
    ).catch(error=>{

      console.warn(
        "Could not optimize audio:",
        error
      );

    });

  }catch(error){

    console.warn(
      "Audio parameter error:",
      error
    );

  }

}


/* =========================
   LOCAL TRACKS
========================= */

function addLocalTracks(){

  if(
    !pc ||
    !localStream
  ){

    return;

  }

  const senders =
    pc.getSenders();

  localStream
    .getTracks()
    .forEach(track=>{

      const alreadyAdded =
        senders.some(
          sender =>
            sender.track &&
            sender.track.kind ===
            track.kind
        );

      if(!alreadyAdded){

        pc.addTrack(
          track,
          localStream
        );

      }

    });

  optimizeAudioSender();

}


/* =========================
   WEBRTC
========================= */

function createPeerConnection(){

  if(pc){

    addLocalTracks();

    return pc;

  }

  pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:[
            "stun:stun.l.google.com:19302",
            "stun:stun1.l.google.com:19302",
            "stun:stun2.l.google.com:19302"
          ]
        }
      ],

      /*
        Keep audio/video bundled into the
        same connection.
      */
      bundlePolicy:"max-bundle",

      rtcpMuxPolicy:"require"

    });


  remoteDescriptionSet =
    false;

  pendingCandidates =
    [];


  addLocalTracks();

  optimizeAudioSender();


  pc.onicecandidate =
    event=>{

      if(event.candidate){

        sendSignal({

          type:"candidate",

          room:roomId,

          candidate:
            event.candidate

        });

      }

    };


  pc.ontrack =
    event=>{

      if(
        event.streams &&
        event.streams[0]
      ){

        addGuestVideo(
          event.streams[0]
        );

      }

    };


  pc.onconnectionstatechange =
    ()=>{

      console.log(
        "WebRTC:",
        pc.connectionState
      );

      if(
        pc.connectionState ===
        "connected"
      ){

        setStatus(
          "Connected — 2 people in room"
        );

      }

      if(
        pc.connectionState ===
        "disconnected"
      ){

        setStatus(
          "Connection temporarily disconnected"
        );

      }

      if(
        pc.connectionState ===
        "failed"
      ){

        setStatus(
          "WebRTC connection failed"
        );

      }

    };


  pc.oniceconnectionstatechange =
    ()=>{

      console.log(
        "ICE:",
        pc.iceConnectionState
      );

    };


  return pc;

}


/* =========================
   SIGNALING
========================= */

function sendSignal(data){

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return false;

  }

  ws.send(
    JSON.stringify(data)
  );

  return true;

}


async function flushPendingCandidates(){

  if(
    !pc ||
    !remoteDescriptionSet
  ){

    return;

  }

  const queued =
    pendingCandidates;

  pendingCandidates = [];

  for(
    const candidate of queued
  ){

    try{

      await pc.addIceCandidate(
        candidate
      );

    }catch(error){

      console.error(
        "ICE candidate error:",
        error
      );

    }

  }

}


function connectSignaling(){

  if(!roomId){

    setStatus(
      "No room ID"
    );

    return;

  }

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){

    return;

  }

  ws =
    new WebSocket(
      SIGNALING_SERVER
    );


  ws.onopen =
    ()=>{

      sendSignal({

        type:"join",

        room:roomId

      });

      setStatus(
        isHost
        ? "Room ready — waiting for friend..."
        : "Joining room..."
      );

    };


  ws.onmessage =
    async event=>{

      let data;

      try{

        data =
          JSON.parse(
            event.data
          );

      }catch{

        return;

      }


      if(data.type === "joined"){

        isHost =
          data.role === "host";

        if(data.movie){

          if(
            typeof data.movie ===
            "string"
          ){

            lastMovieUrl =
              data.movie;

            renderMovie(
              data.movie,
              false
            );

          }else{

            lastMovieUrl =
              data.movie.url || "";

            movieState =
              {
                ...movieState,
                ...(data.movie.state || {})
              };

            if(lastMovieUrl){

              restoreMovie(
                lastMovieUrl
              );

              setTimeout(
                ()=>{
                  syncMovieState(
                    movieState,
                    true
                  );
                },
                1000
              );

            }

          }

        }

        setStatus(
          isHost
          ? "Connected — waiting for the other person..."
          : "Connected — joining the other person..."
        );

        return;

      }


      if(
        data.type === "peer-joined" ||
        data.type === "user-connected"
      ){

        peerPresent = true;

        setStatus(
          "Friend joined — connecting..."
        );

        if(isHost){

          if(lastMovieUrl){

            sendSignal({

              type:"movie",

              room:roomId,

              url:lastMovieUrl

            });

          }

          await createOffer();

        }

        return;

      }


      if(data.type === "offer"){

        peerPresent = true;

        await receiveOffer(
          data.offer
        );

        return;

      }


      if(data.type === "answer"){

        await receiveAnswer(
          data.answer
        );

        return;

      }


      if(data.type === "candidate"){

        await receiveCandidate(
          data.candidate
        );

        return;

      }


      if(data.type === "movie"){

        if(data.url){

          lastMovieUrl =
            data.url;

          movieState = {
            currentTime:0,
            paused:true,
            playbackRate:1,
            volume:1
          };

          renderMovie(
            data.url,
            false
          );

          setStatus(
            "Movie synced"
          );

        }

        return;

      }


      if(data.type === "movie-state"){

        if(
          data.url &&
          data.url !== lastMovieUrl
        ){

          lastMovieUrl =
            data.url;

          renderMovie(
            data.url,
            false
          );

        }

        if(data.state){

          syncMovieState({
            ...data.state,
            updatedAt:
              data.updatedAt ||
              Date.now()
          });

        }

        return;

      }


      if(
        data.type === "room-full" ||
        data.type === "full"
      ){

        setStatus(
          "Room is full"
        );

        return;

      }


      if(
        data.type === "peer-left" ||
        data.type === "user-disconnected"
      ){

        peerPresent = false;

        if(pc){

          try{
            pc.close();
          }catch{}

        }

        pc = null;

        pendingCandidates = [];

        remoteDescriptionSet = false;

        makingOffer = false;

        removeGuestVideo();

        setStatus(
          isHost
          ? "Waiting for friend..."
          : "Friend left the room"
        );

        return;

      }


      if(data.type === "error"){

        setStatus(
          data.message ||
          "Room error"
        );

      }

    };


  ws.onerror =
    error=>{

      console.error(
        "WebSocket error:",
        error
      );

      setStatus(
        "Unable to connect to room server"
      );

    };


  ws.onclose =
    ()=>{

      console.log(
        "WebSocket closed"
      );

    };

}


/* =========================
   OFFER
========================= */

async function createOffer(){

  if(makingOffer){

    return;

  }

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return;

  }

  makingOffer = true;

  try{

    createPeerConnection();

    addLocalTracks();

    optimizeAudioSender();

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    sendSignal({

      type:"offer",

      room:roomId,

      offer:
        pc.localDescription

    });

    setStatus(
      "Connecting..."
    );

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

    setStatus(
      "Unable to create WebRTC offer"
    );

  }finally{

    makingOffer = false;

  }

}


/* =========================
   ANSWER
========================= */

async function receiveOffer(
  offer
){

  try{

    createPeerConnection();

    if(!localStream){

      await startCamera({
        skipRenegotiation:true
      });

    }

    addLocalTracks();

    optimizeAudioSender();

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );

    remoteDescriptionSet = true;

    await flushPendingCandidates();

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(
      answer
    );

    sendSignal({

      type:"answer",

      room:roomId,

      answer:
        pc.localDescription

    });

    setStatus(
      "Connecting..."
    );

  }catch(error){

    console.error(
      "Answer error:",
      error
    );

    setStatus(
      "WebRTC setup failed"
    );

  }

}


/* =========================
   RECEIVE ANSWER
========================= */

async function receiveAnswer(
  answer
){

  try{

    if(!pc){

      return;

    }

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );

    remoteDescriptionSet = true;

    await flushPendingCandidates();

    setStatus(
      "Connecting..."
    );

  }catch(error){

    console.error(
      "Remote answer error:",
      error
    );

  }

}


/* =========================
   ICE
========================= */

async function receiveCandidate(
  candidate
){

  if(
    !pc ||
    !remoteDescriptionSet
  ){

    pendingCandidates.push(
      candidate
    );

    return;

  }

  try{

    await pc.addIceCandidate(
      candidate
    );

  }catch(error){

    console.error(
      "ICE error:",
      error
    );

  }

}


/* =========================
   GUEST VIDEO
========================= */

function addGuestVideo(
  stream
){

  if(
    document.getElementById(
      "guestTile"
    )
  ){

    return;

  }

  const grid =
    document.getElementById(
      "videoGrid"
    );

  if(
    grid.querySelectorAll(
      ".video-tile"
    ).length >= 2
  ){

    return;

  }

  const tile =
    document.createElement(
      "div"
    );

  tile.className =
    "video-tile";

  tile.id =
    "guestTile";


  const video =
    document.createElement(
      "video"
    );

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  /*
    Important:
    The remote audio must not be muted.
  */
  video.muted = false;


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "video-name";

  name.textContent =
    "Guest";


  tile.appendChild(video);

  tile.appendChild(name);

  grid.appendChild(tile);


  document.getElementById(
    "peopleCount"
  ).textContent =
    "2 people in room";

}


/* =========================
   REMOVE GUEST
========================= */

function removeGuestVideo(){

  const guest =
    document.getElementById(
      "guestTile"
    );

  if(guest){

    const video =
      guest.querySelector(
        "video"
      );

    if(video){

      video.srcObject = null;

    }

    guest.remove();

  }

  document.getElementById(
    "peopleCount"
  ).textContent =
    "1 person in room";

}


/* =========================
   MIC
========================= */

function toggleMic(){

  if(!localStream)
    return;

  const tracks =
    localStream.getAudioTracks();

  if(!tracks.length)
    return;

  const enabled =
    tracks[0].enabled;

  tracks.forEach(
    track=>{
      track.enabled =
        !enabled;
    }
  );

  document.getElementById(
    "micButton"
  ).classList.toggle(
    "off",
    enabled
  );

}


/* =========================
   CAMERA
========================= */

function toggleCamera(){

  if(!localStream)
    return;

  const tracks =
    localStream.getVideoTracks();

  if(!tracks.length)
    return;

  const enabled =
    tracks[0].enabled;

  tracks.forEach(
    track=>{
      track.enabled =
        !enabled;
    }
  );

  document.getElementById(
    "cameraButton"
  ).classList.toggle(
    "off",
    enabled
  );

  document.getElementById(
    "localOff"
  ).style.display =
    enabled
    ? "flex"
    : "none";

}


/* =========================
   LEAVE
========================= */

function leaveRoom(){

  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer = null;

  }

  if(ws){

    try{
      ws.close();
    }catch{}

  }

  if(pc){

    try{
      pc.close();
    }catch{}

  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }

  location.href =
    location.pathname;

}


/* =========================
   MOVIE
========================= */

function extractVideoUrl(url){

  return String(
    url || ""
  ).trim();

}


function getMovieState(){

  try{

    if(
      activeMovieType === "youtube" &&
      youtubePlayer &&
      youtubePlayer.getCurrentTime
    ){

      return {

        currentTime:
          Number(
            youtubePlayer.getCurrentTime() ||
            0
          ),

        paused:
          youtubePlayer.getPlayerState() !== 1,

        playbackRate:
          Number(
            youtubePlayer.getPlaybackRate() ||
            1
          ),

        volume:
          Number(
            (
              youtubePlayer.getVolume() ||
              100
            ) / 100
          )

      };

    }


    if(activeMovieElement){

      return {

        currentTime:
          Number(
            activeMovieElement.currentTime ||
            0
          ),

        paused:
          !!activeMovieElement.paused,

        playbackRate:
          Number(
            activeMovieElement.playbackRate ||
            1
          ),

        volume:
          Number(
            activeMovieElement.volume ||
            1
          )

      };

    }

  }catch(error){

    console.warn(
      "Movie state error:",
      error
    );

  }

  return null;

}


function sendMovieState(){

  if(
    suppressMovieSync ||
    !ws ||
    ws.readyState !== WebSocket.OPEN ||
    !roomId
  ){

    return;

  }

  const state =
    getMovieState();

  if(!state)
    return;

  movieState = state;

  sendSignal({

    type:"movie-state",

    room:roomId,

    url:lastMovieUrl,

    state:state,

    updatedAt:
      Date.now()

  });

}


function syncMovieState(
  state
){

  if(!state)
    return;

  movieState = {
    ...movieState,
    ...state
  };

  let targetTime =
    Number(
      state.currentTime || 0
    );

  if(
    !state.paused &&
    state.updatedAt
  ){

    const elapsed =
      Math.max(
        0,
        (
          Date.now() -
          Number(state.updatedAt)
        ) / 1000
      );

    targetTime +=
      elapsed *
      Number(
        state.playbackRate ||
        1
      );

  }

  suppressMovieSync = true;

  try{

    if(
      activeMovieType === "youtube" &&
      youtubePlayer
    ){

      youtubePlayer.seekTo(
        targetTime,
        true
      );

      if(
        state.playbackRate &&
        youtubePlayer.setPlaybackRate
      ){

        youtubePlayer.setPlaybackRate(
          Number(
            state.playbackRate
          )
        );

      }

      if(
        typeof state.volume === "number" &&
        youtubePlayer.setVolume
      ){

        youtubePlayer.setVolume(
          Math.round(
            state.volume * 100
          )
        );

      }

      if(state.paused){

        youtubePlayer.pauseVideo();

      }else{

        youtubePlayer.playVideo();

      }

    }else if(activeMovieElement){

      activeMovieElement.currentTime =
        targetTime;

      if(state.playbackRate){

        activeMovieElement.playbackRate =
          Number(
            state.playbackRate
          );

      }

      if(
        typeof state.volume ===
        "number"
      ){

        activeMovieElement.volume =
          Math.max(
            0,
            Math.min(
              1,
              Number(
                state.volume
              )
            )
          );

      }

      if(state.paused){

        activeMovieElement.pause();

      }else{

        activeMovieElement
          .play()
          .catch(()=>{});

      }

    }

  }catch(error){

    console.warn(
      "Movie sync error:",
      error
    );

  }

  setTimeout(
    ()=>{
      suppressMovieSync = false;
    },
    300
  );

}


function movieEventState(){

  if(suppressMovieSync)
    return;

  sendMovieState();

}


function attachHtmlVideoSync(
  video
){

  activeMovieElement =
    video;

  [
    "play",
    "pause",
    "seeked",
    "ratechange",
    "volumechange"
  ].forEach(
    eventName=>{

      video.addEventListener(
        eventName,
        movieEventState
      );

    }
  );


  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

  }


  movieSyncTimer =
    setInterval(
      ()=>{

        if(
          !suppressMovieSync &&
          !video.paused
        ){

          sendMovieState();

        }

      },
      700
    );

}


function createYouTubePlayer(
  iframe
){

  const startPlayer =
    ()=>{

      try{

        youtubePlayer =
          new YT.Player(
            iframe,
            {

              events:{

                onReady:()=>{

                  if(movieState){

                    syncMovieState(
                      movieState
                    );

                  }

                  if(movieSyncTimer){

                    clearInterval(
                      movieSyncTimer
                    );

                  }

                  movieSyncTimer =
                    setInterval(
                      ()=>{

                        if(
                          !suppressMovieSync &&
                          youtubePlayer &&
                          youtubePlayer.getPlayerState &&
                          youtubePlayer.getPlayerState() ===
                          YT.PlayerState.PLAYING
                        ){

                          sendMovieState();

                        }

                      },
                      700
                    );

                },


                onStateChange:event=>{

                  if(
                    suppressMovieSync
                  )
                    return;

                  if(
                    event.data ===
                    YT.PlayerState.PLAYING
                  ){

                    sendMovieState();

                  }

                  if(
                    event.data ===
                    YT.PlayerState.PAUSED
                  ){

                    sendMovieState();

                  }

                },


                onPlaybackRateChange:()=>{

                  if(
                    !suppressMovieSync
                  ){

                    sendMovieState();

                  }

                }

              }

            }
          );

      }catch(error){

        console.warn(
          "YouTube player error:",
          error
        );

      }

    };


  if(
    window.YT &&
    YT.Player
  ){

    startPlayer();

  }else{

    window.onYouTubeIframeAPIReady =
      startPlayer;

  }

}


function renderMovie(
  url
){

  url =
    extractVideoUrl(
      url
    );

  if(!url)
    return false;

  const container =
    document.getElementById(
      "movieContainer"
    );

  if(!container)
    return false;


  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer = null;

  }


  youtubePlayer = null;
  vimeoPlayer = null;
  activeMovieElement = null;
  activeMovieType = null;


  const youtube =
    url.match(
      /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
    );


  if(youtube){

    activeMovieType =
      "youtube";

    const iframe =
      document.createElement(
        "iframe"
      );

    iframe.id =
      "sharedYoutubePlayer";

    iframe.src =
      "https://www.youtube.com/embed/" +
      youtube[1] +
      "?enablejsapi=1&origin=" +
      encodeURIComponent(
        location.origin
      ) +
      "&rel=0";

    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";

    iframe.allowFullscreen = true;

    iframe.title =
      "Shared movie";

    container.innerHTML = "";

    container.appendChild(
      iframe
    );

    createYouTubePlayer(
      iframe
    );

    return true;

  }


  const video =
    document.createElement(
      "video"
    );

  video.src = url;

  video.controls = true;

  video.playsInline = true;

  video.autoplay = false;

  video.addEventListener(
    "error",
    ()=>{
      setStatus(
        "Hindi ma-play ang video URL"
      );
    }
  );

  container.innerHTML = "";

  container.appendChild(
    video
  );

  attachHtmlVideoSync(
    video
  );

  return true;

}


function loadMovie(){

  const url =
    extractVideoUrl(
      document.getElementById(
        "movieUrl"
      ).value
    );

  if(!url){

    setStatus(
      "Maglagay muna ng movie/video URL"
    );

    return;

  }

  if(
    !renderMovie(url)
  ){

    return;

  }

  lastMovieUrl =
    url;

  movieState = {

    currentTime:0,

    paused:true,

    playbackRate:1,

    volume:1,

    updatedAt:
      Date.now()

  };


  sendSignal({

    type:"movie",

    room:roomId,

    url:url

  });


  sendMovieState();


  setStatus(
    "Movie loaded — syncing to friend..."
  );

}


function restoreMovie(
  url
){

  if(!url)
    return;

  const input =
    document.getElementById(
      "movieUrl"
    );

  if(input){

    input.value =
      url;

  }

  renderMovie(
    url
  );

}
