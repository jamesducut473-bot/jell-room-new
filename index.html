<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jell & James Movie</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef5ee;
  color:#26352a;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
START
========================= */

.start-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.start-card{
  width:min(420px,100%);
  background:white;
  border-radius:22px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 10px 35px rgba(40,70,45,.12);
}

.start-title{
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
}

.start-subtitle{
  color:#718073;
  font-size:14px;
  margin-bottom:25px;
}

.start-button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
  background:#739b78;
  color:white;
  font-weight:700;
}

.start-button.secondary{
  background:#edf3ed;
  color:#456049;
}

/* =========================
INTRO
========================= */

.intro{
  height:64px;
  background:#dcebdc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #c9dcc9;
  transition:.5s;
}

.intro.hidden{
  height:0;
  opacity:0;
  padding:0;
  border:0;
  overflow:hidden;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.room-status{
  font-size:13px;
  color:#55705b;
}

/* =========================
MAIN
========================= */

.main{
  display:grid;
  grid-template-columns:minmax(0,7fr) minmax(190px,3fr);
  gap:12px;
  padding:14px;
  max-width:1700px;
  margin:auto;
}

.movie-card{
  background:#000;
  border-radius:16px;
  overflow:hidden;
  aspect-ratio:16/9;
}

.movie-card iframe,
.movie-card video{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.movie-placeholder{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  text-align:center;
  padding:30px;
}

.movie-info{
  background:white;
  border-radius:14px;
  margin-top:12px;
  padding:16px;
}

.movie-title{
  font-size:21px;
  font-weight:700;
}

.movie-input{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.movie-input input{
  flex:1;
  border:1px solid #ccd8cc;
  border-radius:10px;
  padding:11px;
  outline:none;
}

.primary{
  border:0;
  background:#739b78;
  color:white;
  border-radius:10px;
  padding:11px 15px;
}

/* =========================
VIDEO CALL
========================= */

.side{
  background:white;
  border-radius:16px;
  padding:8px;
  min-height:0;
}

.side-title{
  font-weight:700;
  padding:4px 4px 12px;
}

.video-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.video-tile{
  background:#18221b;
  border-radius:14px;
  overflow:hidden;
  aspect-ratio:16/9;
  position:relative;
  min-height:0;
}

.video-tile video{
  width:100%;
  height:100%;
  object-fit:cover;
}

#localVideo{
  transform:scaleX(-1);
}

.video-name{
  position:absolute;
  left:8px;
  bottom:7px;
  background:rgba(0,0,0,.6);
  color:white;
  padding:4px 7px;
  border-radius:6px;
  font-size:12px;
}

.video-off{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  color:white;
  background:#39483c;
}

/* =========================
CONTROLS
========================= */

.controls{
  display:flex;
  justify-content:center;
  gap:9px;
  padding-top:12px;
}

.control{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#edf2ed;
  color:#26352a;
  display:flex;
  align-items:center;
  justify-content:center;
}

.control.off{
  background:#c96f6f;
  color:white;
}

.control.end{
  background:#bd5555;
  color:white;
  width:58px;
  border-radius:23px;
}

.icon{
  width:21px;
  height:21px;
}

/* =========================
STATUS
========================= */

.status{
  font-size:12px;
  color:#68756b;
  margin-top:8px;
}

/* =========================
MOBILE
========================= */

@media(max-width:850px){

  .main{
    grid-template-columns:1fr;
  }

  .side{
    min-height:0;
    padding:14px;
  }

  .video-grid{
    grid-template-columns:1fr;
    gap:12px;
  }

}

/* =========================
LANDSCAPE PHONE
========================= */

@media(max-width:850px) and (orientation:landscape){

  .main{
    grid-template-columns:minmax(0,7.4fr) minmax(120px,2.6fr);
    gap:7px;
    padding:7px;
    height:calc(100dvh - 64px);
    max-height:calc(100dvh - 64px);
    overflow:hidden;
  }

  .main > section{
    min-width:0;
    min-height:0;
  }

  .movie-card{
    height:100%;
    aspect-ratio:auto;
    border-radius:10px;
  }

  .movie-info{
    display:none;
  }

  .side{
    padding:5px;
    border-radius:9px;
    height:100%;
    max-height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .side-title{
    font-size:10px;
    line-height:14px;
    padding:0 2px 3px;
    flex:0 0 17px;
  }

  .video-grid{
    flex:1;
    min-height:0;
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:4px;
    overflow:hidden;
  }

  .video-tile{
    height:100%;
    max-height:100%;
    aspect-ratio:auto;
    border-radius:6px;
  }

  .video-name{
    font-size:8px;
    left:4px;
    bottom:3px;
    padding:2px 4px;
  }

  .controls{
    padding-top:4px;
    gap:4px;
    flex:0 0 31px;
  }

  .control{
    width:26px;
    height:26px;
  }

  .control.end{
    width:34px;
    border-radius:13px;
  }

}

/* =========================
PORTRAIT PHONE
========================= */

@media(max-width:520px) and (orientation:portrait){

  .video-grid{
    grid-template-columns:1fr;
  }

  .video-tile{
    aspect-ratio:16/9;
  }

}

</style>

</head>

<body>

<!-- =========================
START SCREEN
========================= -->

<div
  class="start-screen"
  id="startScreen"
>

  <div class="start-card">

    <div class="start-title">
      Jell & James Movie
    </div>

    <div class="start-subtitle">
      Watch together with someone
    </div>

    <button
      class="start-button"
      onclick="makeRoom()"
    >
      Make Room
    </button>

    <button
      class="start-button secondary"
      onclick="joinRoomPrompt()"
    >
      Join Room
    </button>

  </div>

</div>


<!-- =========================
WATCH ROOM
========================= -->

<div
  id="watchRoom"
  style="display:none"
>

  <div
    class="intro"
    id="intro"
  >

    <div class="logo">
      Jell & James Movie
    </div>

    <div
      class="room-status"
      id="roomStatus"
    >
      Starting...
    </div>

  </div>


  <main class="main">

    <section>

      <div
        class="movie-card"
        id="movieContainer"
      >

        <div class="movie-placeholder">
          Paste a movie/video URL below to start watching.
        </div>

      </div>


      <div class="movie-info">

        <div class="movie-title">
          Watch Together
        </div>

        <div class="movie-input">

          <input
            id="movieUrl"
            placeholder="Paste YouTube, Vimeo or video URL..."
          >

          <button
            class="primary"
            onclick="loadMovie()"
          >
            Play
          </button>

        </div>

      </div>

    </section>


    <!-- VIDEO CALL -->

    <aside class="side">

      <div class="side-title">
        Video Call
      </div>


      <div
        class="video-grid"
        id="videoGrid"
      >

        <div
          class="video-tile"
          id="localTile"
        >

          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>

          <div
            class="video-off"
            id="localOff"
          >
            Camera Off
          </div>

          <div class="video-name">
            You
          </div>

        </div>

      </div>


      <div class="controls">

        <button
          class="control"
          id="micButton"
          onclick="toggleMic()"
          title="Mute"
        >
          🎙️
        </button>

        <button
          class="control"
          id="cameraButton"
          onclick="toggleCamera()"
          title="Turn camera off"
        >
          📹
        </button>

        <button
          class="control end"
          onclick="leaveRoom()"
          title="Leave room"
        >
          ✕
        </button>

      </div>


      <div
        class="status"
        id="connectionStatus"
      >
        Connecting...
      </div>

    </aside>

  </main>

</div>


<script>

/* =====================================================
CONFIG
===================================================== */

const SIGNALING_SERVER =
  "wss://jell-room-new.onrender.com";

const AUTO_ROOM_ID =
  "jell-auto-room";


/* =====================================================
STATE
===================================================== */

let ws = null;

let pc = null;

let localStream = null;

let roomId = AUTO_ROOM_ID;

let isHost = false;

let peerPresent = false;

let reconnectTimer = null;

let offerRetryTimer = null;

let connectionRetryCount = 0;

let pendingCandidates = [];

let remoteDescriptionSet = false;

let makingOffer = false;

let lastMovieUrl = "";

let movieState = {
  currentTime:0,
  paused:true,
  playbackRate:1,
  volume:1
};

let movieSyncTimer = null;

let suppressMovieSync = false;

let activeMovieType = null;

let activeMovieElement = null;

let youtubePlayer = null;

let vimeoPlayer = null;


/* =====================================================
YOUTUBE API
===================================================== */

const ytScript =
  document.createElement("script");

ytScript.src =
  "https://www.youtube.com/iframe_api";

document.head.appendChild(
  ytScript
);


/* =====================================================
STATUS
===================================================== */

function setStatus(text){

  const status =
    document.getElementById(
      "connectionStatus"
    );

  const roomStatus =
    document.getElementById(
      "roomStatus"
    );

  if(status){
    status.textContent =
      text;
  }

  if(roomStatus){
    roomStatus.textContent =
      text;
  }

}


/* =====================================================
START
===================================================== */

function makeRoom(){

  roomId =
    "jell-" +
    Math.random()
      .toString(36)
      .slice(2,10);

  isHost = true;

  openRoom();

}


function joinRoomPrompt(){

  const value =
    prompt(
      "Paste the room ID or invitation link:"
    );

  if(!value) return;

  try{

    const url =
      new URL(value);

    roomId =
      url.searchParams.get("room")
      || value;

  }catch{

    roomId = value;

  }

  isHost = false;

  openRoom();

}


/* =====================================================
OPEN ROOM
===================================================== */

function openRoom(){

  document.getElementById(
    "startScreen"
  ).style.display =
    "none";

  document.getElementById(
    "watchRoom"
  ).style.display =
    "block";

  connectSignaling();

  startCamera();

}


/* =====================================================
CAMERA
===================================================== */

async function startCamera(){

  if(localStream){

    return localStream;

  }

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30,max:30}
        },

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }

      });


    const video =
      document.getElementById(
        "localVideo"
      );

    video.srcObject =
      localStream;

    video.muted = true;

    video.playsInline = true;

    video.play().catch(()=>{});


    if(pc){

      addLocalTracks();

      if(peerPresent && isHost){

        createOffer(true);

      }

    }


    setStatus(
      peerPresent
      ? "Camera ready — reconnecting..."
      : "Camera ready — waiting..."
    );


    return localStream;

  }catch(error){

    console.error(
      "Camera error:",
      error
    );

    setStatus(
      "Camera/mic permission needed"
    );

    return null;

  }

}


/* =====================================================
WEBRTC PEER CONNECTION
===================================================== */

function createPeerConnection(){

  if(pc){

    return pc;

  }


  pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:[
            "stun:stun.l.google.com:19302",
            "stun:stun1.l.google.com:19302",
            "stun:stun2.l.google.com:19302"
          ]
        }

      ],

      bundlePolicy:"max-bundle",

      rtcpMuxPolicy:"require"

    });


  remoteDescriptionSet = false;

  pendingCandidates = [];


  addLocalTracks();


  pc.onicecandidate =
    event=>{

      if(event.candidate){

        sendSignal({

          type:"candidate",

          room:roomId,

          candidate:
            event.candidate

        });

      }

    };


  pc.ontrack =
    event=>{

      if(
        !event.streams ||
        !event.streams[0]
      ){

        return;

      }

      addGuestVideo(
        event.streams[0]
      );

    };


  pc.onconnectionstatechange =
    ()=>{

      if(!pc) return;

      const state =
        pc.connectionState;

      console.log(
        "Connection:",
        state
      );


      if(state === "connected"){

        connectionRetryCount = 0;

        clearOfferRetry();

        setStatus(
          "Connected — 2 people in room"
        );

        return;

      }


      if(
        state === "disconnected" ||
        state === "failed"
      ){

        setStatus(
          "Reconnecting..."
        );

        scheduleReconnect();

      }


      if(state === "closed"){

        setStatus(
          "Connection closed"
        );

      }

    };


  pc.oniceconnectionstatechange =
    ()=>{

      if(!pc) return;

      const state =
        pc.iceConnectionState;

      console.log(
        "ICE:",
        state
      );


      if(
        state === "failed" ||
        state === "disconnected"
      ){

        scheduleReconnect();

      }

    };


  return pc;

}


/* =====================================================
ADD LOCAL TRACKS
===================================================== */

function addLocalTracks(){

  if(!pc || !localStream){

    return;

  }


  const senders =
    pc.getSenders();


  for(
    const track of
    localStream.getTracks()
  ){

    const existing =
      senders.find(
        sender =>
          sender.track &&
          sender.track.kind ===
          track.kind
      );


    if(existing){

      if(existing.track !== track){

        existing.replaceTrack(
          track
        );

      }

    }else{

      pc.addTrack(
        track,
        localStream
      );

    }

  }

}


/* =====================================================
SIGNALING
===================================================== */

function connectSignaling(){

  if(
    ws &&
    (
      ws.readyState ===
      WebSocket.OPEN ||
      ws.readyState ===
      WebSocket.CONNECTING
    )
  ){

    return;

  }


  setStatus(
    "Connecting to room..."
  );


  ws =
    new WebSocket(
      SIGNALING_SERVER
    );


  ws.onopen =
    ()=>{

      console.log(
        "Signaling connected"
      );


      sendSignal({

        type:"join",

        room:roomId

      });


      setStatus(
        "Joining room..."
      );

    };


  ws.onmessage =
    async event=>{

      let data;

      try{

        data =
          JSON.parse(
            event.data
          );

      }catch{

        return;

      }


      /*
      =========================================
      JOINED
      =========================================
      */

      if(data.type === "joined"){

        isHost =
          data.role === "host";

        peerPresent =
          !!data.peerPresent;


        if(data.movie){

          lastMovieUrl =
            data.movie.url || "";

          movieState =
            data.movie.state || movieState;

          if(lastMovieUrl){

            renderMovie(
              lastMovieUrl,
              false
            );

            setTimeout(
              ()=>{
                syncMovieState(
                  movieState,
                  true
                );
              },
              1000
            );

          }

        }


        setStatus(
          peerPresent
          ? "Room connected — waiting for video call..."
          : "Waiting for friend..."
        );


        return;

      }


      /*
      =========================================
      PEER JOINED
      =========================================
      */

      if(data.type === "peer-joined"){

        peerPresent = true;

        setStatus(
          "Friend joined — connecting..."
        );


        /*
        ONLY HOST STARTS THE OFFER.
        This prevents offer collisions.
        */

        if(isHost){

          await waitForCamera();

          await rebuildConnection();

          await createOffer(true);

        }

        return;

      }


      /*
      =========================================
      OFFER
      =========================================
      */

      if(data.type === "offer"){

        peerPresent = true;

        await receiveOffer(
          data.offer
        );

        return;

      }


      /*
      =========================================
      ANSWER
      =========================================
      */

      if(data.type === "answer"){

        await receiveAnswer(
          data.answer
        );

        return;

      }


      /*
      =========================================
      ICE
      =========================================
      */

      if(data.type === "candidate"){

        await receiveCandidate(
          data.candidate
        );

        return;

      }


      /*
      =========================================
      MOVIE
      =========================================
      */

      if(data.type === "movie"){

        if(data.url){

          lastMovieUrl =
            data.url;

          movieState =
            data.state || {
              currentTime:0,
              paused:true,
              playbackRate:1,
              volume:1
            };

          renderMovie(
            data.url,
            false
          );

          setTimeout(
            ()=>{
              syncMovieState(
                movieState,
                true
              );
            },
            800
          );

        }

        return;

      }


      /*
      =========================================
      MOVIE STATE
      =========================================
      */

      if(data.type === "movie-state"){

        if(
          data.url &&
          data.url !==
          lastMovieUrl
        ){

          lastMovieUrl =
            data.url;

          renderMovie(
            data.url,
            false
          );

        }


        if(data.state){

          movieState =
            {
              ...movieState,
              ...data.state
            };

          syncMovieState(
            {
              ...movieState,
              updatedAt:
                data.updatedAt
            }
          );

        }

        return;

      }


      /*
      =========================================
      PEER LEFT
      =========================================
      */

      if(
        data.type === "peer-left"
      ){

        peerPresent = false;

        clearOfferRetry();

        closePeerConnection();

        removeGuestVideo();

        setStatus(
          "Friend left — waiting..."
        );

        return;

      }


      if(
        data.type === "room-full"
      ){

        setStatus(
          "Room is full"
        );

        return;

      }


      if(data.type === "error"){

        setStatus(
          data.message ||
          "Room error"
        );

      }

    };


  ws.onerror =
    error=>{

      console.error(
        "WebSocket error:",
        error
      );

      setStatus(
        "Room connection error"
      );

    };


  ws.onclose =
    ()=>{

      console.log(
        "Signaling disconnected"
      );


      if(
        document.getElementById(
          "watchRoom"
        ).style.display !==
        "none"
      ){

        setStatus(
          "Reconnecting to room..."
        );


        clearTimeout(
          reconnectTimer
        );


        reconnectTimer =
          setTimeout(
            connectSignaling,
            1500
          );

      }

    };

}


/* =====================================================
WAIT FOR CAMERA
===================================================== */

async function waitForCamera(){

  if(localStream){

    return true;

  }


  const stream =
    await startCamera();

  return !!stream;

}


/* =====================================================
REBUILD CONNECTION
===================================================== */

async function rebuildConnection(){

  closePeerConnection();

  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        150
      )
  );

  createPeerConnection();

}


/* =====================================================
CREATE OFFER
===================================================== */

async function createOffer(
  iceRestart = false
){

  if(
    !isHost ||
    !peerPresent ||
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ){

    return;

  }


  if(makingOffer){

    return;

  }


  makingOffer = true;


  try{

    createPeerConnection();

    addLocalTracks();


    const offer =
      await pc.createOffer({
        iceRestart
      });


    await pc.setLocalDescription(
      offer
    );


    sendSignal({

      type:"offer",

      room:roomId,

      offer:
        pc.localDescription

    });


    setStatus(
      "Connecting video call..."
    );


    scheduleOfferRetry();

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }finally{

    makingOffer = false;

  }

}


/* =====================================================
OFFER RETRY
===================================================== */

function scheduleOfferRetry(){

  clearOfferRetry();


  offerRetryTimer =
    setTimeout(
      async ()=>{

        if(
          peerPresent &&
          isHost &&
          pc &&
          pc.connectionState !==
          "connected"
        ){

          connectionRetryCount++;


          if(
            connectionRetryCount <= 8
          ){

            console.log(
              "Retrying WebRTC connection..."
            );


            await rebuildConnection();

            await createOffer(
              true
            );

          }

        }

      },
      3000
    );

}


function clearOfferRetry(){

  if(offerRetryTimer){

    clearTimeout(
      offerRetryTimer
    );

    offerRetryTimer = null;

  }

}


/* =====================================================
RECONNECT
===================================================== */

function scheduleReconnect(){

  if(!peerPresent){

    return;

  }


  if(
    !isHost
  ){

    return;

  }


  if(
    offerRetryTimer
  ){

    return;

  }


  scheduleOfferRetry();

}


/* =====================================================
RECEIVE OFFER
===================================================== */

async function receiveOffer(
  offer
){

  try{

    /*
    Guest always accepts host offer.
    */

    if(!pc){

      createPeerConnection();

    }


    await waitForCamera();

    addLocalTracks();


    /*
    Clean old connection state if necessary.
    */

    if(
      pc.signalingState !==
      "stable" &&
      pc.remoteDescription
    ){

      closePeerConnection();

      createPeerConnection();

      await waitForCamera();

      addLocalTracks();

    }


    await pc.setRemoteDescription(
      new RTCSessionDescription(
        offer
      )
    );


    remoteDescriptionSet =
      true;


    await flushPendingCandidates();


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    sendSignal({

      type:"answer",

      room:roomId,

      answer:
        pc.localDescription

    });


    setStatus(
      "Connecting video call..."
    );

  }catch(error){

    console.error(
      "Receive offer error:",
      error
    );

    /*
    Ask host to retry by notifying through
    a fresh room connection if necessary.
    */

  }

}


/* =====================================================
RECEIVE ANSWER
===================================================== */

async function receiveAnswer(
  answer
){

  if(!pc){

    return;

  }


  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        answer
      )
    );


    remoteDescriptionSet =
      true;


    await flushPendingCandidates();


  }catch(error){

    console.error(
      "Answer error:",
      error
    );


    if(isHost){

      await rebuildConnection();

      await createOffer(
        true
      );

    }

  }

}


/* =====================================================
ICE CANDIDATES
===================================================== */

async function receiveCandidate(
  candidate
){

  if(
    !pc ||
    !remoteDescriptionSet
  ){

    pendingCandidates.push(
      candidate
    );

    return;

  }


  try{

    await pc.addIceCandidate(
      candidate
    );

  }catch(error){

    console.error(
      "ICE error:",
      error
    );

  }

}


async function flushPendingCandidates(){

  if(
    !pc ||
    !remoteDescriptionSet
  ){

    return;

  }


  const candidates =
    pendingCandidates.slice();


  pendingCandidates = [];


  for(
    const candidate of
    candidates
  ){

    try{

      await pc.addIceCandidate(
        candidate
      );

    }catch(error){

      console.error(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =====================================================
SEND SIGNAL
===================================================== */

function sendSignal(data){

  if(
    !ws ||
    ws.readyState !==
    WebSocket.OPEN
  ){

    return false;

  }


  ws.send(
    JSON.stringify(data)
  );


  return true;

}


/* =====================================================
CLOSE PEER
===================================================== */

function closePeerConnection(){

  if(pc){

    try{

      pc.ontrack = null;
      pc.onicecandidate = null;

      pc.close();

    }catch{}

  }


  pc = null;

  pendingCandidates = [];

  remoteDescriptionSet = false;

  makingOffer = false;

}


/* =====================================================
GUEST VIDEO
===================================================== */

function addGuestVideo(stream){

  let tile =
    document.getElementById(
      "guestTile"
    );


  if(!tile){

    tile =
      document.createElement(
        "div"
      );

    tile.className =
      "video-tile";

    tile.id =
      "guestTile";


    const video =
      document.createElement(
        "video"
      );

    video.autoplay = true;

    video.playsInline = true;

    video.controls = false;

    /*
    Remote audio stays enabled,
    but we make sure there is only ONE
    remote video element.
    */

    video.srcObject =
      stream;


    video.volume = 1;


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "video-name";

    name.textContent =
      "Friend";


    tile.appendChild(
      video
    );

    tile.appendChild(
      name
    );


    document
      .getElementById(
        "videoGrid"
      )
      .appendChild(
        tile
      );

  }else{

    const video =
      tile.querySelector(
        "video"
      );

    if(video){

      if(
        video.srcObject !==
        stream
      ){

        video.srcObject =
          stream;

      }

      video.play().catch(
        ()=>{}
      );

    }

  }

}


/* =====================================================
REMOVE GUEST VIDEO
===================================================== */

function removeGuestVideo(){

  const tile =
    document.getElementById(
      "guestTile"
    );

  if(tile){

    const video =
      tile.querySelector(
        "video"
      );

    if(video){

      video.srcObject =
        null;

    }

    tile.remove();

  }

}


/* =====================================================
MIC
===================================================== */

function toggleMic(){

  if(!localStream) return;


  const tracks =
    localStream.getAudioTracks();


  if(!tracks.length) return;


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track=>{
      track.enabled =
        !enabled;
    }
  );


  document
    .getElementById(
      "micButton"
    )
    .classList.toggle(
      "off",
      enabled
    );

}


/* =====================================================
CAMERA
===================================================== */

function toggleCamera(){

  if(!localStream) return;


  const tracks =
    localStream.getVideoTracks();


  if(!tracks.length) return;


  const enabled =
    tracks[0].enabled;


  tracks.forEach(
    track=>{
      track.enabled =
        !enabled;
    }
  );


  document
    .getElementById(
      "cameraButton"
    )
    .classList.toggle(
      "off",
      enabled
    );


  document
    .getElementById(
      "localOff"
    )
    .style.display =
      enabled
      ? "flex"
      : "none";

}


/* =====================================================
MOVIE URL
===================================================== */

function extractVideoUrl(url){

  return String(
    url || ""
  ).trim();

}


/* =====================================================
GET MOVIE STATE
===================================================== */

function getMovieState(){

  try{

    if(
      activeMovieType ===
      "youtube" &&
      youtubePlayer
    ){

      return {

        currentTime:
          Number(
            youtubePlayer
              .getCurrentTime() || 0
          ),

        paused:
          youtubePlayer
            .getPlayerState() !== 1,

        playbackRate:
          Number(
            youtubePlayer
              .getPlaybackRate() || 1
          ),

        volume:
          Number(
            (
              youtubePlayer
                .getVolume() || 100
            ) / 100
          )

      };

    }


    if(activeMovieElement){

      return {

        currentTime:
          Number(
            activeMovieElement
              .currentTime || 0
          ),

        paused:
          !!activeMovieElement.paused,

        playbackRate:
          Number(
            activeMovieElement
              .playbackRate || 1
          ),

        volume:
          Number(
            activeMovieElement
              .volume || 1
          )

      };

    }

  }catch(error){

    console.warn(
      "Movie state error:",
      error
    );

  }


  return null;

}


/* =====================================================
SEND MOVIE STATE
===================================================== */

function sendMovieState(){

  if(
    suppressMovieSync ||
    !ws ||
    ws.readyState !==
    WebSocket.OPEN ||
    !roomId
  ){

    return;

  }


  const state =
    getMovieState();


  if(!state) return;


  movieState =
    state;


  sendSignal({

    type:"movie-state",

    room:roomId,

    url:lastMovieUrl,

    state,

    updatedAt:
      Date.now()

  });

}


/* =====================================================
MOVIE EVENT
===================================================== */

function movieEvent(){

  if(
    suppressMovieSync
  ){

    return;

  }


  sendMovieState();

}


/* =====================================================
HTML VIDEO SYNC
===================================================== */

function attachHtmlVideoSync(
  video
){

  activeMovieElement =
    video;


  [
    "play",
    "pause",
    "seeked",
    "ratechange",
    "volumechange"
  ]
  .forEach(
    eventName=>{

      video.addEventListener(
        eventName,
        movieEvent
      );

    }
  );


  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

  }


  movieSyncTimer =
    setInterval(
      ()=>{

        if(
          !suppressMovieSync &&
          !video.paused
        ){

          sendMovieState();

        }

      },
      700
    );

}


/* =====================================================
SYNC MOVIE
===================================================== */

function syncMovieState(
  state,
  initial = false
){

  if(!state) return;


  movieState =
    {
      ...movieState,
      ...state
    };


  let targetTime =
    Number(
      state.currentTime || 0
    );


  if(
    !state.paused &&
    state.updatedAt
  ){

    const elapsed =
      Math.max(
        0,
        (
          Date.now() -
          Number(
            state.updatedAt
          )
        ) / 1000
      );


    targetTime +=
      elapsed *
      Number(
        state.playbackRate || 1
      );

  }


  suppressMovieSync =
    true;


  try{

    if(
      activeMovieType ===
      "youtube" &&
      youtubePlayer
    ){

      youtubePlayer.seekTo(
        targetTime,
        true
      );


      if(
        state.playbackRate &&
        youtubePlayer.setPlaybackRate
      ){

        youtubePlayer.setPlaybackRate(
          Number(
            state.playbackRate
          )
        );

      }


      if(
        typeof state.volume ===
        "number" &&
        youtubePlayer.setVolume
      ){

        youtubePlayer.setVolume(
          Math.round(
            state.volume * 100
          )
        );

      }


      if(state.paused){

        youtubePlayer.pauseVideo();

      }else{

        youtubePlayer.playVideo();

      }

    }else if(
      activeMovieElement
    ){

      activeMovieElement.currentTime =
        targetTime;


      if(state.playbackRate){

        activeMovieElement.playbackRate =
          Number(
            state.playbackRate
          );

      }


      if(
        typeof state.volume ===
        "number"
      ){

        activeMovieElement.volume =
          Math.max(
            0,
            Math.min(
              1,
              Number(
                state.volume
              )
            )
          );

      }


      if(state.paused){

        activeMovieElement.pause();

      }else{

        activeMovieElement
          .play()
          .catch(
            ()=>{}
          );

      }

    }

  }catch(error){

    console.warn(
      "Movie sync error:",
      error
    );

  }


  setTimeout(
    ()=>{
      suppressMovieSync =
        false;
    },
    initial
      ? 500
      : 200
  );

}


/* =====================================================
YOUTUBE
===================================================== */

function createYouTubePlayer(
  iframe
){

  const start =
    ()=>{

      if(!window.YT) return;


      try{

        youtubePlayer =
          new YT.Player(
            iframe,
            {

              events:{

                onReady:()=>{

                  if(movieState){

                    syncMovieState(
                      movieState,
                      true
                    );

                  }


                  if(movieSyncTimer){

                    clearInterval(
                      movieSyncTimer
                    );

                  }


                  movieSyncTimer =
                    setInterval(
                      ()=>{

                        if(
                          !suppressMovieSync &&
                          youtubePlayer &&
                          youtubePlayer
                            .getPlayerState &&
                          youtubePlayer
                            .getPlayerState()
                            ===
                            YT.PlayerState.PLAYING
                        ){

                          sendMovieState();

                        }

                      },
                      700
                    );

                },


                onStateChange:event=>{

                  if(
                    suppressMovieSync
                  ){

                    return;

                  }


                  if(
                    event.data ===
                    YT.PlayerState.PLAYING ||
                    event.data ===
                    YT.PlayerState.PAUSED
                  ){

                    sendMovieState();

                  }

                }

              }

            }
          );

      }catch(error){

        console.error(
          "YouTube error:",
          error
        );

      }

    };


  if(
    window.YT &&
    window.YT.Player
  ){

    start();

  }else{

    window.onYouTubeIframeAPIReady =
      start;

  }

}


/* =====================================================
RENDER MOVIE
===================================================== */

function renderMovie(
  url,
  announce = true
){

  url =
    extractVideoUrl(
      url
    );


  if(!url){

    return false;

  }


  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer =
      null;

  }


  youtubePlayer = null;

  vimeoPlayer = null;

  activeMovieElement = null;

  activeMovieType = null;


  const container =
    document.getElementById(
      "movieContainer"
    );


  /*
  IMPORTANT:
  Movie is only rebuilt when the URL actually changes.
  This prevents unnecessary reloads when someone joins.
  */

  const current =
    container.dataset.movieUrl || "";


  if(
    current === url &&
    container.querySelector(
      "iframe,video"
    )
  ){

    return true;

  }


  container.dataset.movieUrl =
    url;


  const youtube =
    url.match(
      /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
    );


  if(youtube){

    activeMovieType =
      "youtube";


    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.id =
      "sharedYoutubePlayer";


    iframe.src =
      "https://www.youtube.com/embed/" +
      youtube[1] +
      "?enablejsapi=1&rel=0";


    iframe.allow =
      "autoplay; fullscreen; picture-in-picture";


    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";


    container.appendChild(
      iframe
    );


    createYouTubePlayer(
      iframe
    );


    return true;

  }


  const video =
    document.createElement(
      "video"
    );


  video.src =
    url;

  video.controls =
    true;

  video.playsInline =
    true;

  video.preload =
    "metadata";


  video.addEventListener(
    "error",
    ()=>{
      setStatus(
        "Hindi ma-play ang video URL"
      );
    }
  );


  container.innerHTML =
    "";


  container.appendChild(
    video
  );


  attachHtmlVideoSync(
    video
  );


  return true;

}


/* =====================================================
LOAD MOVIE
===================================================== */

function loadMovie(){

  const input =
    document.getElementById(
      "movieUrl"
    );


  const url =
    extractVideoUrl(
      input.value
    );


  if(!url){

    setStatus(
      "Maglagay muna ng movie/video URL"
    );

    return;

  }


  /*
  Do not reload the same movie.
  */

  const alreadyLoaded =
    lastMovieUrl === url &&
    document
      .getElementById(
        "movieContainer"
      )
      .querySelector(
        "iframe,video"
      );


  if(!alreadyLoaded){

    renderMovie(
      url,
      true
    );

  }


  lastMovieUrl =
    url;


  movieState = {

    currentTime:0,

    paused:true,

    playbackRate:1,

    volume:1

  };


  sendSignal({

    type:"movie",

    room:roomId,

    url,

    state:movieState

  });


  sendMovieState();


  setStatus(
    "Movie loaded — syncing..."
  );

}


/* =====================================================
RESTORE MOVIE
===================================================== */

function restoreMovie(url){

  if(!url) return;


  const input =
    document.getElementById(
      "movieUrl"
    );


  if(input){

    input.value =
      url;

  }


  renderMovie(
    url,
    false
  );

}


/* =====================================================
LEAVE
===================================================== */

function leaveRoom(){

  if(movieSyncTimer){

    clearInterval(
      movieSyncTimer
    );

    movieSyncTimer =
      null;

  }


  clearOfferRetry();


  if(ws){

    try{
      ws.close();
    }catch{}

  }


  closePeerConnection();


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          track.stop();
        }
      );

    localStream =
      null;

  }


  location.href =
    location.pathname;

}

AUTOMATIC START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    /*
    Automatic room.
    First visitor becomes host.
    Second visitor becomes guest.
    */

    openRoom();

    setTimeout(

        const intro =
          document.getElementById(
            "intro"
          );

        if(intro){

          intro.classList.add(
            "hidden"
          );

        }

      },
      10000
    );

  }
);
