<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Jell & James</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef5ee;
  color: #26352a;
}

.header {
  height: 64px;
  background: #dcebdc;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #c9dcc9;
}

.logo {
  font-weight: 700;
  font-size: 20px;
}

.status {
  font-size: 13px;
}

.main {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(190px, 3fr);
  gap: 12px;
  padding: 14px;
  max-width: 1700px;
  margin: auto;
}

.movie-card {
  background: #000;
  border-radius: 16px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.movie-card iframe,
.movie-card video {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.placeholder {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
}

.movie-info {
  background: white;
  border-radius: 14px;
  margin-top: 12px;
  padding: 16px;
}

.movie-title {
  font-size: 20px;
  font-weight: 700;
}

.movie-input {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.movie-input input {
  flex: 1;
  min-width: 0;
  padding: 11px;
  border: 1px solid #ccd8cc;
  border-radius: 10px;
}

.primary {
  border: 0;
  background: #739b78;
  color: white;
  border-radius: 10px;
  padding: 11px 15px;
}

.side {
  background: white;
  border-radius: 16px;
  padding: 8px;
}

.video-grid {
  display: grid;
  gap: 8px;
}

.video-tile {
  position: relative;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}

.video-tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#localVideo {
  transform: scaleX(-1);
}

.video-name {
  position: absolute;
  left: 8px;
  bottom: 7px;
  background: rgba(0,0,0,.6);
  color: white;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 12px;
}

.camera-off {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  color: white;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding-top: 12px;
}

.control {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  background: #edf2ed;
}

.control.off {
  background: #c96f6f;
  color: white;
}

.end {
  background: #bd5555;
  color: white;
}

@media (max-width: 850px) {
  .main {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    Jell & James
  </div>

  <div
    class="status"
    id="roomStatus"
  >
    Connecting...
  </div>

</header>


<main class="main">

<section>

  <div
    class="movie-card"
    id="movieContainer"
  >
    <div class="placeholder">
      Paste a video URL below.
    </div>
  </div>

  <div class="movie-info">

    <div class="movie-title">
      Watch Together
    </div>

    <div class="movie-input">

      <input
        id="movieUrl"
        placeholder="Paste video URL..."
      >

      <button
        class="primary"
        onclick="loadMovie()"
      >
        Play
      </button>

    </div>

  </div>

</section>


<aside class="side">

  <div class="video-grid">

    <div class="video-tile">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div
        class="camera-off"
        id="cameraOff"
      >
        Camera Off
      </div>

      <div class="video-name">
        You
      </div>

    </div>


    <div
      class="video-tile"
      id="guestTile"
      style="display:none;"
    >

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div class="video-name">
        Friend
      </div>

    </div>

  </div>


  <div class="controls">

    <button
      class="control"
      id="micButton"
      onclick="toggleMic()"
    >
      🎙️
    </button>

    <button
      class="control"
      id="cameraButton"
      onclick="toggleCamera()"
    >
      📹
    </button>

    <button
      class="control end"
      onclick="leaveRoom()"
    >
      ✕
    </button>

  </div>

</aside>

</main>


<script>

/*
==================================================
PALITAN ITO NG ACTUAL RENDER URL MO
==================================================
*/

const SIGNALING_URL =
  "wss://YOUR-RENDER-DOMAIN.onrender.com";


/*
==================================================
CLIENT ID
==================================================
*/

let clientId =
  localStorage.getItem(
    "jell-client-id"
  );

if (!clientId) {

  clientId =
    crypto.randomUUID();

  localStorage.setItem(
    "jell-client-id",
    clientId
  );

}


/*
==================================================
STATE
==================================================
*/

let socket = null;

let localStream = null;

let peerConnection = null;

let role = null;

let peerPresent = false;

let reconnectTimer = null;

let reconnectAttempts = 0;

let pendingCandidates = [];

let remoteDescriptionReady = false;

let stopped = false;


/*
==================================================
STATUS
==================================================
*/

function setStatus(text) {

  document.getElementById(
    "roomStatus"
  ).textContent = text;

}


/*
==================================================
CAMERA + MICROPHONE
==================================================
*/

async function startLocalMedia() {

  if (localStream) {
    return true;
  }

  try {

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }
        },

        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1
        }

      });


    const localVideo =
      document.getElementById(
        "localVideo"
      );

    localVideo.srcObject =
      localStream;

    await localVideo.play().catch(
      () => {}
    );


    return true;

  } catch (error) {

    console.error(
      "getUserMedia failed:",
      error
    );

    setStatus(
      "Allow camera and microphone access."
    );

    return false;

  }

}


/*
==================================================
WEBSOCKET
==================================================
*/

function connect() {

  if (stopped) {
    return;
  }

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }


  setStatus(
    "Connecting..."
  );


  socket =
    new WebSocket(
      SIGNALING_URL
    );


  socket.onopen =
    async () => {

      reconnectAttempts = 0;


      setStatus(
        "Joining room..."
      );


      await startLocalMedia();


      socket.send(
        JSON.stringify({
          type: "join",
          clientId
        })
      );

    };


  socket.onmessage =
    async event => {

      let message;

      try {

        message =
          JSON.parse(
            event.data
          );

      } catch {

        return;

      }


      /*
      ================================
      JOINED
      ================================
      */

      if (message.type === "joined") {

        clientId =
          message.clientId;

        localStorage.setItem(
          "jell-client-id",
          clientId
        );


        role =
          message.role;

        peerPresent =
          Boolean(
            message.peerPresent
          );


        if (!peerPresent) {

          setStatus(
            "Waiting for your friend..."
          );

          return;
        }


        setStatus(
          "Friend found..."
        );


        /*
         * HOST starts the WebRTC offer.
         */

        if (role === "host") {

          await startCall();

        }

        return;
      }


      /*
      ================================
      PEER JOINED
      ================================
      */

      if (
        message.type === "peer-joined" ||
        message.type === "peer-reconnected"
      ) {

        peerPresent = true;


        setStatus(
          "Connecting video..."
        );


        if (role === "host") {

          await startCall();

        }

        return;
      }


      /*
      ================================
      OFFER
      ================================
      */

      if (message.type === "offer") {

        peerPresent = true;

        await receiveOffer(
          message.offer
        );

        return;
      }


      /*
      ================================
      ANSWER
      ================================
      */

      if (message.type === "answer") {

        await receiveAnswer(
          message.answer
        );

        return;
      }


      /*
      ================================
      ICE
      ================================
      */

      if (message.type === "candidate") {

        await receiveCandidate(
          message.candidate
        );

        return;
      }


      /*
      ================================
      PEER DISCONNECTED
      ================================
      */

      if (
        message.type ===
        "peer-disconnected"
      ) {

        peerPresent = false;

        closePeer();

        removeRemoteVideo();

        setStatus(
          "Friend disconnected. Waiting..."
        );

        return;
      }


      /*
      ================================
      ROOM FULL
      ================================
      */

      if (message.type === "room-full") {

        setStatus(
          "Room is full — maximum 2 users."
        );

        return;
      }

    };


  socket.onerror =
    error => {

      console.error(
        "WebSocket error:",
        error
      );

    };


  socket.onclose =
    () => {

      if (stopped) {
        return;
      }


      setStatus(
        "Disconnected. Reconnecting..."
      );


      reconnectAttempts++;


      const delay =
        Math.min(
          1000 *
          Math.pow(
            1.5,
            reconnectAttempts
          ),
          5000
        );


      clearTimeout(
        reconnectTimer
      );


      reconnectTimer =
        setTimeout(
          connect,
          delay
        );

    };

}


/*
==================================================
START CALL
==================================================
*/

async function startCall() {

  if (!peerPresent) {
    return;
  }


  closePeer();


  await createPeerConnection();


  try {

    const offer =
      await peerConnection
        .createOffer();


    await peerConnection
      .setLocalDescription(
        offer
      );


    send({
      type: "offer",
      offer:
        peerConnection.localDescription
    });


  } catch (error) {

    console.error(
      "Create offer failed:",
      error
    );

  }

}


/*
==================================================
CREATE PEER CONNECTION
==================================================
*/

async function createPeerConnection() {

  closePeer();


  peerConnection =
    new RTCPeerConnection({

      /*
       * STUN helps discover public addresses.
       * TURN may still be needed for difficult NATs.
       */

      iceServers: [
        {
          urls: [
            "stun:stun.l.google.com:19302",
            "stun:stun1.l.google.com:19302"
          ]
        }
      ],

      bundlePolicy: "max-bundle",

      rtcpMuxPolicy: "require"

    });


  remoteDescriptionReady =
    false;

  pendingCandidates =
    [];


  /*
   * ADD CAMERA + MICROPHONE
   */

  if (localStream) {

    for (
      const track of
      localStream.getTracks()
    ) {

      peerConnection.addTrack(
        track,
        localStream
      );

    }

  }


  /*
   * ICE
   */

  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({
          type: "candidate",
          candidate:
            event.candidate
        });

      }

    };


  /*
   * REMOTE AUDIO + VIDEO
   */

  peerConnection.ontrack =
    event => {

      console.log(
        "Remote track received:",
        event.track.kind
      );


      let stream =
        event.streams[0];


      /*
       * Some browsers may not provide
       * event.streams[0], so create a stream.
       */

      if (!stream) {

        const remoteVideo =
          document.getElementById(
            "remoteVideo"
          );

        stream =
          remoteVideo.srcObject ||
          new MediaStream();

        stream.addTrack(
          event.track
        );

      }


      const remoteVideo =
        document.getElementById(
          "remoteVideo"
        );


      remoteVideo.srcObject =
        stream;


      document.getElementById(
        "guestTile"
      ).style.display =
        "block";


      remoteVideo
        .play()
        .catch(error => {

          console.warn(
            "Remote video autoplay:",
            error
          );

        });


      setStatus(
        "Connected ✓"
      );

    };


  /*
   * CONNECTION STATE
   */

  peerConnection
    .onconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      console.log(
        "Connection state:",
        peerConnection.connectionState
      );


      switch (
        peerConnection.connectionState
      ) {

        case "connected":

          setStatus(
            "Connected ✓"
          );

          break;


        case "connecting":

          setStatus(
            "Connecting video..."
          );

          break;


        case "disconnected":

          setStatus(
            "Video connection interrupted..."
          );

          break;


        case "failed":

          setStatus(
            "Video connection failed. Retrying..."
          );

          if (role === "host") {

            setTimeout(
              () => {

                if (
                  peerPresent &&
                  socket &&
                  socket.readyState ===
                    WebSocket.OPEN
                ) {

                  startCall();

                }

              },
              1500
            );

          }

          break;

      }

    };


  peerConnection
    .oniceconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }


      console.log(
        "ICE state:",
        peerConnection.iceConnectionState
      );

    };

}


/*
==================================================
RECEIVE OFFER
==================================================
*/

async function receiveOffer(
  offer
) {

  try {

    await createPeerConnection();


    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


    remoteDescriptionReady =
      true;


    await flushCandidates();


    const answer =
      await peerConnection
        .createAnswer();


    await peerConnection
      .setLocalDescription(
        answer
      );


    send({
      type: "answer",
      answer:
        peerConnection.localDescription
    });


  } catch (error) {

    console.error(
      "Receive offer failed:",
      error
    );

    setStatus(
      "Could not connect video."
    );

  }

}


/*
==================================================
RECEIVE ANSWER
==================================================
*/

async function receiveAnswer(
  answer
) {

  if (!peerConnection) {
    return;
  }


  try {

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


    remoteDescriptionReady =
      true;


    await flushCandidates();


  } catch (error) {

    console.error(
      "Receive answer failed:",
      error
    );

  }

}


/*
==================================================
ICE CANDIDATE
==================================================
*/

async function receiveCandidate(
  candidate
) {

  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {

    pendingCandidates.push(
      candidate
    );

    return;

  }


  try {

    await peerConnection
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

  } catch (error) {

    console.warn(
      "ICE candidate failed:",
      error
    );

  }

}


/*
==================================================
FLUSH ICE CANDIDATES
==================================================
*/

async function flushCandidates() {

  if (
    !peerConnection ||
    !remoteDescriptionReady
  ) {
    return;
  }


  const candidates =
    pendingCandidates;


  pendingCandidates =
    [];


  for (
    const candidate of
    candidates
  ) {

    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    } catch (error) {

      console.warn(
        "Queued ICE failed:",
        error
      );

    }

  }

}


/*
==================================================
SEND SIGNAL
==================================================
*/

function send(message) {

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {

    return false;

  }


  socket.send(
    JSON.stringify(
      message
    )
  );


  return true;

}


/*
==================================================
CLOSE PEER
==================================================
*/

function closePeer() {

  if (peerConnection) {

    try {

      peerConnection.ontrack =
        null;

      peerConnection.onicecandidate =
        null;

      peerConnection.close();

    } catch {}

  }


  peerConnection =
    null;

  remoteDescriptionReady =
    false;

  pendingCandidates =
    [];

}


/*
==================================================
REMOVE REMOTE VIDEO
==================================================
*/

function removeRemoteVideo() {

  const remoteVideo =
    document.getElementById(
      "remoteVideo"
    );


  remoteVideo.srcObject =
    null;


  document.getElementById(
    "guestTile"
  ).style.display =
    "none";

}


/*
==================================================
MIC
==================================================
*/

function toggleMic() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getAudioTracks();


  for (
    const track of tracks
  ) {

    track.enabled =
      !track.enabled;

  }


  const muted =
    tracks.length > 0 &&
    !tracks[0].enabled;


  document.getElementById(
    "micButton"
  ).classList.toggle(
    "off",
    muted
  );

}


/*
==================================================
CAMERA
==================================================
*/

function toggleCamera() {

  if (!localStream) {
    return;
  }


  const tracks =
    localStream.getVideoTracks();


  for (
    const track of tracks
  ) {

    track.enabled =
      !track.enabled;

  }


  const off =
    tracks.length > 0 &&
    !tracks[0].enabled;


  document.getElementById(
    "cameraButton"
  ).classList.toggle(
    "off",
    off
  );


  document.getElementById(
    "cameraOff"
  ).style.display =
    off
      ? "flex"
      : "none";

}


/*
==================================================
MOVIE
==================================================
*/

function loadMovie() {

  const url =
    document
      .getElementById(
        "movieUrl"
      )
      .value
      .trim();


  if (!url) {
    return;
  }


  const youtubeId =
    getYouTubeId(
      url
    );


  const container =
    document.getElementById(
      "movieContainer"
    );


  if (youtubeId) {

    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.src =
      "https://www.youtube.com/embed/" +
      youtubeId;


    iframe.allow =
      "autoplay; fullscreen";


    iframe.allowFullscreen =
      true;


    container.innerHTML =
      "";

    container.appendChild(
      iframe
    );

  } else {

    const video =
      document.createElement(
        "video"
      );


    video.src =
      url;

    video.controls =
      true;

    video.playsInline =
      true;


    container.innerHTML =
      "";

    container.appendChild(
      video
    );

  }

}


function getYouTubeId(url) {

  const match =
    url.match(
      /(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([^&?/]+)/
    );


  return match
    ? match[1]
    : null;

}


/*
==================================================
LEAVE
==================================================
*/

function leaveRoom() {

  stopped = true;


  clearTimeout(
    reconnectTimer
  );


  closePeer();


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream =
      null;

  }


  if (socket) {

    try {
      socket.close();
    } catch {}

  }


  removeRemoteVideo();


  setStatus(
    "Disconnected."
  );

}


/*
==================================================
START
==================================================
*/

(async function start() {

  await startLocalMedia();

  connect();

})();

</script>

</body>

</html>
